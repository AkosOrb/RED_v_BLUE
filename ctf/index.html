<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red vs Blue CTF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Same HUD look as the main Red vs Blue app: grey ground, black chamfered frames. */
:root{
  --ground:#A3A3A3; --paper:#B9B9B9; --ink:#111111; --mute:#4a4a4a;
  --red:#E6492D; --blue:#2C9AD6; --white:#FFFFFF; --soft:#D6D6D6; --ok:#2f8f4e;
  --btn-bg:#123A63; --btn-bg2:#1A4F85; --btn-fg:#FFA13D; --btn-on-bg:#FF8A12; --btn-on-fg:#0B2B4C;
  --f-disp:'Orbitron','Arial Black',sans-serif; --f-body:'Chakra Petch','Segoe UI',system-ui,sans-serif; --f-mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
h3{font-family:var(--f-disp);font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.mono{font-family:var(--f-mono)}
.hint{color:var(--mute);font-size:13px}
.cut{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.frame{background:var(--ink);padding:2px}
.frame>.fi{background:var(--paper);padding:14px 16px;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.panel{background:var(--ink);color:var(--soft);padding:14px 16px}
.panel h2,.panel h3{color:var(--white)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:0;background:var(--btn-bg);color:var(--btn-fg);padding:10px 16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:hover{background:var(--btn-bg2)}
.btn.red{box-shadow:inset 6px 0 0 var(--red)}.btn.blue{box-shadow:inset 6px 0 0 var(--blue)}
.btn.ghost{box-shadow:inset 0 0 0 2px var(--btn-fg)}
.btn.sm{padding:6px 10px;font-size:11px}
.btn[aria-pressed=true]{background:var(--btn-on-bg);color:var(--btn-on-fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password]{font-family:var(--f-mono);font-size:16px;padding:9px 10px;border:2px solid var(--ink);background:var(--white);color:var(--ink);width:100%;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.04em}
.logo .r{color:var(--red)}.logo .b{color:var(--blue)}
.pill{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;padding:3px 8px;border:1.5px solid var(--ink)}
.banner{background:#FFA13D;color:var(--ink);padding:8px 12px;font-size:13px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.play{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.play{grid-template-columns:1fr}}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:var(--ink);color:var(--soft);padding:8px 10px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.layer .n{font-family:var(--f-disp);font-weight:900;font-size:18px;color:var(--white)}
.layer[aria-current=true]{background:var(--btn-on-bg);color:var(--ink)}.layer[aria-current=true] .n{color:var(--ink)}
.layer[disabled]{opacity:.5;cursor:not-allowed}
.bar{height:6px;background:#333;margin-top:4px}.bar>i{display:block;height:100%;background:var(--ok)}
.flag{border-top:2px solid var(--ink);padding:12px 0}
.flag .q{font-weight:700}
.ok{color:var(--ok);font-weight:700}
.bad{color:#a01818;font-weight:700}
.keybox{border:2px dashed var(--ink);padding:8px 12px;background:var(--soft)}
.keybox b{font-family:var(--f-mono);font-size:16px}
.hints li{margin:4px 0}
table.data{border-collapse:collapse;font-family:var(--f-mono);font-size:12px;width:100%}
table.data th,table.data td{border:1px solid var(--ink);padding:3px 6px;text-align:left;white-space:nowrap}
table.data th{background:var(--ink);color:var(--white);cursor:pointer;position:sticky;top:0}
table.data tr:nth-child(even) td{background:#c6c6c6}
.tablewrap{max-height:420px;overflow:auto;border:2px solid var(--ink);background:var(--soft)}
pre.txt{white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:13px;background:var(--soft);border:2px solid var(--ink);padding:10px;margin:0}
table.lb{border-collapse:collapse;width:100%}
table.lb th,table.lb td{border-bottom:1px solid var(--mute);padding:6px 8px;text-align:left}
table.lb th{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 6px;background:var(--ink);color:var(--white)}
.tag.r{background:var(--red)}.tag.b{background:var(--blue)}
.err{color:#a01818;font-weight:700;min-height:1.4em}
svg.tl{width:100%;height:auto;display:block;background:var(--soft);border:2px solid var(--ink);font-family:var(--f-mono)}
svg.tl text{font-size:12px;fill:var(--ink)}
svg.tl .grid{stroke:#9a9a9a;stroke-width:1}
svg.tl .score{fill:none;stroke:var(--blue);stroke-width:3}
svg.tl .area{fill:var(--blue);opacity:.15}
svg.tl .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:tl-draw 1.6s ease-out forwards}
svg.tl .pop{transform-box:fill-box;transform-origin:center;animation:tl-pop .6s cubic-bezier(.3,1.6,.5,1) backwards}
svg.tl .now{stroke:var(--btn-on-bg);stroke-width:2;animation:tl-pulse 1.5s ease-in-out infinite}
@keyframes tl-draw{to{stroke-dashoffset:0}}
@keyframes tl-pop{from{transform:scale(0);opacity:0}}
@keyframes tl-pulse{50%{opacity:.25}}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;animation:tl-pulse 1.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){svg.tl .draw,svg.tl .pop,svg.tl .now,.live{animation:none;stroke-dashoffset:0}}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
'use strict';
// ---------------------------------------------------------------- basics
const CFG = window.CTF_CONFIG || {};
let LANG = (() => { try { return localStorage.getItem('rvb-lang') === 'en' ? 'en' : 'hu'; } catch (e) { return 'hu'; } })();
const L = (hu, en) => LANG === 'en' ? en : hu;
const T = o => o ? (o[LANG] || o.hu || '') : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
};
const norm = s => String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '');
const enc = new TextEncoder();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
async function sha256(data) { return crypto.subtle.digest('SHA-256', typeof data === 'string' ? enc.encode(data) : data); }
async function flagHash(tid, fid, ans) { return hex(await sha256(`${tid}:${fid}:${norm(ans)}`)); }
async function openKey(tid, fa, fb, ansA, ansB, cipherHex) {
  const secret = new Uint8Array(await sha256(`${tid}:key:${fa}:${fb}:${norm(ansA)}:${norm(ansB)}`));
  const data = new Uint8Array(cipherHex.match(/../g).map(h => parseInt(h, 16)));
  const out = new Uint8Array(data.length);
  for (let i = 0, blk = 0; i < data.length; blk++) {
    const ctr = new Uint8Array(secret.length + 4); ctr.set(secret); new DataView(ctr.buffer).setUint32(secret.length, blk);
    const ks = new Uint8Array(await sha256(ctr));
    for (let j = 0; j < ks.length && i < data.length; j++, i++) out[i] = data[i] ^ ks[j];
  }
  return new TextDecoder().decode(out);
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const USER_RE = /^[a-z0-9._-]{3,24}$/;

// ---------------------------------------------------------------- rules
const LAYERS = 7, FLAGS = 4, HINT_COST = [10, 25, 50], MULT = { easy: 1, hard: 1.5 };
// The CTF is incident response only: every game follows these 7 stages. Attacker techniques show up only
// as something the player has to recognise in the evidence.
const SIDE = 'blue';
const LAYER_NAMES = [['Riasztás', 'Alert'], ['Triázs', 'Triage'], ['Naplóelemzés', 'Log analysis'], ['Forenzika', 'Forensics'], ['Elszigetelés', 'Containment'], ['Felszámolás', 'Eradication'], ['Helyreállítás', 'Recovery']];
function flagPoints(k, mode, hintsTaken, late) {
  const cost = HINT_COST.slice(0, hintsTaken).reduce((a, b) => a + b, 0);
  return Math.round(25 * k * (late ? 0.5 : 1) * (1 - cost / 100) * MULT[mode]);
}
// Sum of the rounded flag values, so the shown maximum always matches what can be earned.
const layerMax = (k, mode) => FLAGS * flagPoints(k, mode, 0, false);
function scoreOf(g) {
  let s = 0;
  for (const tid of g.state.tasks) for (const f of Object.values(g.state.flags[tid] || {})) s += f.pts;
  return s;
}

// ---------------------------------------------------------------- backends
// Local trial backend: everything lives in this browser's localStorage.
const LocalBackend = {
  kind: 'local',
  users() { return store.get('rvbctf-users') || {}; },
  async register(username, pw) {
    const us = this.users();
    if (us[username]) throw new Error(L('Ez a felhasználónév már foglalt.', 'This username is taken.'));
    const salt = uid();
    us[username] = { id: uid(), salt, pw: hex(await sha256(salt + pw)) };
    store.set('rvbctf-users', us);
    return this.login(username, pw);
  },
  async login(username, pw) {
    const u = this.users()[username];
    if (!u || u.pw !== hex(await sha256(u.salt + pw))) throw new Error(L('Hibás felhasználónév vagy jelszó.', 'Wrong username or password.'));
    store.set('rvbctf-session', { username });
    return this.me();
  },
  async me() {
    const s = store.get('rvbctf-session'); if (!s) return null;
    const u = this.users()[s.username]; if (!u) return null;
    return { id: u.id, username: s.username, role: (CFG.localInstructors || []).includes(s.username) ? 'instructor' : 'player' };
  },
  async logout() { store.set('rvbctf-session', null); },
  games() { return store.get('rvbctf-games') || []; },
  async myGames(user) { return this.games().filter(g => g.user_id === user.id); },
  async saveGame(user, g) {
    const all = this.games(); const i = all.findIndex(x => x.id === g.id);
    const row = { ...g, user_id: user.id, username: user.username, updated_at: new Date().toISOString() };
    if (i < 0) all.push(row); else all[i] = row;
    store.set('rvbctf-games', all); return row;
  },
  async log(user, gameId, type, data) {
    const ev = store.get('rvbctf-events') || [];
    ev.push({ user_id: user.id, username: user.username, game_id: gameId, type, data, at: new Date().toISOString() });
    store.set('rvbctf-events', ev);
  },
  async leaderboard() { return this.games().map(g => ({ username: g.username, side: g.side, mode: g.mode, score: g.score, layer: g.layer, closed: g.closed, updated_at: g.updated_at })); },
  async allGames() { return this.games(); },
  async deleteGames(ids) {
    const gone = id => ids === 'all' || ids.includes(id), games = this.games();
    store.set('rvbctf-games', games.filter(g => !gone(g.id)));
    store.set('rvbctf-events', (store.get('rvbctf-events') || []).filter(e => !gone(e.game_id)));
    return games.filter(g => gone(g.id)).length;
  },
  async events(gameId) { return (store.get('rvbctf-events') || []).filter(e => e.game_id === gameId); },
};

// Supabase backend: plain REST calls, no client library. See supabase/schema.sql.
const SupabaseBackend = {
  kind: 'supabase',
  url: (CFG.supabaseUrl || '').replace(/\/$/, ''), key: CFG.supabaseAnonKey,
  sess() { return store.get('rvbctf-sb'); },
  email: u => `${u}@players.rvbctf.example.com`,
  async auth(path, body) {
    const r = await fetch(`${this.url}/auth/v1/${path}`, { method: 'POST', headers: { apikey: this.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.msg || j.error_description || j.message || r.statusText);
    return j;
  },
  async refresh() {
    const s = this.sess(); if (!s) return false;
    try { const j = await this.auth('token?grant_type=refresh_token', { refresh_token: s.refresh_token }); store.set('rvbctf-sb', { ...s, access_token: j.access_token, refresh_token: j.refresh_token }); return true; }
    catch (e) { store.set('rvbctf-sb', null); return false; }
  },
  async rest(path, opt = {}, retry = true) {
    const s = this.sess();
    const r = await fetch(`${this.url}/rest/v1/${path}`, {
      ...opt, headers: { apikey: this.key, ...(s ? { Authorization: `Bearer ${s.access_token}` } : {}), 'Content-Type': 'application/json', Prefer: 'return=representation', ...(opt.headers || {}) },
    });
    if (r.status === 401 && retry && await this.refresh()) return this.rest(path, opt, false);
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error((j && (j.message || j.hint)) || r.statusText);
    return j;
  },
  async register(username, pw) {
    try { await this.auth('signup', { email: this.email(username), password: pw, data: { username } }); }
    catch (e) { throw new Error(/registered|exists|Database error/i.test(e.message) ? L('Ez a felhasználónév már foglalt.', 'This username is taken.') : e.message); }
    return this.login(username, pw);
  },
  async login(username, pw) {
    let j;
    try { j = await this.auth('token?grant_type=password', { email: this.email(username), password: pw }); }
    catch (e) { throw new Error(L('Hibás felhasználónév vagy jelszó.', 'Wrong username or password.')); }
    store.set('rvbctf-sb', { access_token: j.access_token, refresh_token: j.refresh_token, uid: j.user.id });
    return this.me();
  },
  async me() {
    const s = this.sess(); if (!s) return null;
    try { const p = await this.rest(`profiles?id=eq.${s.uid}&select=id,username,role`); return p[0] || null; }
    catch (e) { return null; }
  },
  async logout() { store.set('rvbctf-sb', null); },
  async myGames(user) { return this.rest(`games?user_id=eq.${user.id}&select=*&order=started_at.desc`); },
  async saveGame(user, g) {
    const row = { id: g.id, user_id: user.id, side: g.side, mode: g.mode, state: g.state, score: g.score, layer: g.layer, closed: g.closed, updated_at: new Date().toISOString() };
    const r = await this.rest('games?on_conflict=id', { method: 'POST', headers: { Prefer: 'return=representation,resolution=merge-duplicates' }, body: JSON.stringify(row) });
    return r[0];
  },
  async log(user, gameId, type, data) {
    try { await this.rest('events', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ user_id: user.id, game_id: gameId, type, data }) }); } catch (e) { console.warn('log', e); }
  },
  async leaderboard() { return this.rest('leaderboard?select=*'); },
  // Instructors only (games_delete policy); events go with their game (on delete cascade).
  async deleteGames(ids) {
    const r = await this.rest(ids === 'all' ? 'games?id=not.is.null&select=id' : `games?id=in.(${ids.join(',')})&select=id`, { method: 'DELETE' });
    if (!r.length) throw new Error(L('Nem sikerült törölni. Az adatbázisban hiányzik az oktatói törlési jog (lásd supabase/schema.sql).', 'Nothing was deleted. The database lacks the instructor delete permission (see supabase/schema.sql).'));
    return r.length;
  },
  async allGames() { return this.rest('games?select=*,profiles(username)&order=updated_at.desc').then(r => r.map(g => ({ ...g, username: g.profiles && g.profiles.username }))); },
  async events(gameId) { return this.rest(`events?game_id=eq.${gameId}&select=*&order=at.asc`); },
};
const BACK = CFG.supabaseUrl && CFG.supabaseAnonKey ? SupabaseBackend : LocalBackend;

// ---------------------------------------------------------------- app state
let USER = null, GAME = null, INDEX = null, VIEW = 'login', CUR = 1, MSG = {}, BUSY = false;
let FILEVIEW = null;            // {name, kind, rows|text, sort, filter}
let TEACH = { games: null, sel: null, events: null, seen: null, at: null, pick: new Set(), del: null, msg: '' };  // del: null | 'sel' | 'all' (awaiting confirmation)
const LIVE_MS = 5000;           // instructor view refresh interval
const TASKS = {};
const app = document.getElementById('app');

// Standalone build (ctf/tools/build_standalone.py) embeds every task and file in window.CTF_BUNDLE,
// so the page also works opened straight from disk, without a web server.
const BUNDLE = window.CTF_BUNDLE || null;
// Inside a claude.ai Artifact the viewer blocks file downloads, so files open as raw text with a copy button instead.
const NO_DL = !!window.CTF_ARTIFACT;
let CONFIRM_CLOSE = false;
const getText = path => BUNDLE ? Promise.resolve(BUNDLE.files[path]) : fetch(path).then(r => r.text());
async function loadIndex() {
  if (!INDEX) INDEX = BUNDLE ? BUNDLE.index : await fetch('index.json', { cache: 'no-store' }).then(r => r.json());
  return INDEX;
}
async function loadTask(tid) {
  if (!TASKS[tid]) {
    const meta = INDEX.tasks.find(t => t.id === tid);
    const base = meta.path;
    TASKS[tid] = JSON.parse(await getText(`${base}/task.json`));
    TASKS[tid]._base = base;
  }
  return TASKS[tid];
}
const log = (type, data = {}) => GAME && BACK.log(USER, GAME.id, type, data);
async function persist() {
  GAME.score = scoreOf(GAME);
  GAME.layer = Math.min(GAME.state.unlocked, LAYERS);
  await BACK.saveGame(USER, GAME);
}

// ---------------------------------------------------------------- views
function topHTML() {
  return `<div class="top"><div class="row"><a class="logo" href="${BUNDLE ? (CFG.menuUrl || '#') : '../index.html'}" title="${L('Vissza a Red vs Blue főmenübe', 'Back to the Red vs Blue menu')}"><span class="r">RED</span> VS <span class="b">BLUE</span></a><span class="pill">CTF</span></div>
   <div class="row">${USER ? `<span class="mono">${esc(USER.username)}${USER.role === 'instructor' ? ' · ' + L('oktató', 'instructor') : ''}</span>
    <button class="btn sm ghost" data-a="home">${L('Kezdőlap', 'Home')}</button><button class="btn sm ghost" data-a="board">${L('Ranglista', 'Leaderboard')}</button>
    ${USER.role === 'instructor' ? `<button class="btn sm ghost" data-a="teach">${L('Oktatói felület', 'Instructor view')}</button>` : ''}
    <button class="btn sm ghost" data-a="logout">${L('Kilépés', 'Log out')}</button>` : ''}
    <button class="btn sm" data-a="lang">${LANG === 'en' ? 'HU' : 'EN'}</button></div></div>
   ${BACK.kind === 'local' ? `<div class="banner">${L('Helyi próbamód: a fiókok és eredmények csak ebben a böngészőben tárolódnak.', 'Local trial mode: accounts and results are stored only in this browser.')}${BUNDLE ? '' : ' ' + L('Az online módhoz a config.js-ben meg kell adni a Supabase adatait.', 'Online mode needs the Supabase settings in config.js.')}</div>` : ''}`;
}

function loginHTML() {
  return `<div class="grid2"><div class="frame cut"><div class="fi stack">
    <div><div class="lbl">${L('Egyéni CTF játékmód', 'Individual CTF mode')}</div><h2 style="margin-top:4px">${L('Belépés', 'Log in')}</h2></div>
    <label><span class="lbl">${L('Felhasználónév', 'Username')}</span><input type="text" id="u" autocomplete="username" maxlength="24"></label>
    <label><span class="lbl">${L('Jelszó', 'Password')}</span><input type="password" id="p" autocomplete="current-password"></label>
    <div class="err" id="err">${esc(MSG.login || '')}</div>
    <div class="row"><button class="btn" data-a="login">${L('Belépés', 'Log in')}</button><button class="btn ghost" data-a="register">${L('Regisztráció', 'Register')}</button></div>
    <p class="hint">${L('Felhasználónév: 3–24 karakter, kisbetű, szám, pont, kötőjel vagy aláhúzás. Jelszó: legalább 8 karakter.', 'Username: 3–24 characters, lowercase letters, digits, dot, hyphen or underscore. Password: at least 8 characters.')}</p>
   </div></div>
   <div class="panel cut stack"><h3>${L('Hogyan működik?', 'How does it work?')}</h3>

const EV_NAMES = { start: ['Játék indítása', 'Game started'], open_layer: ['Réteg megnyitása', 'Layer opened'], view_file: ['Fájl megnyitása', 'File viewed'], download: ['Fájl letöltése', 'File downloaded'], submit: ['Zászló beküldése', 'Flag submitted'], hint: ['Tipp kérése', 'Hint taken'], unlock: ['Következő réteg megnyílt', 'Next layer unlocked'], finish: ['Mind a 7 réteg teljesítve', 'All 7 layers completed'], close: ['Játék lezárása', 'Game closed'] };
// Animated timeline chart: cumulative score on top, one lane per event kind below.
// Events not seen before pop in; the first view of a game (or Replay) animates everything in order.
const TL_LANES = [
  { kind: e => ['start', 'open_layer', 'unlock', 'finish', 'close'].includes(e.type), hu: 'Rétegek', en: 'Layers', color: 'var(--ink)' },
  { kind: e => e.type === 'submit' && e.data && e.data.ok, hu: 'Helyes', en: 'Correct', color: 'var(--ok)' },
  { kind: e => e.type === 'submit' && !(e.data && e.data.ok), hu: 'Hibás', en: 'Wrong', color: '#a01818' },
  { kind: e => e.type === 'hint', hu: 'Tipp', en: 'Hint', color: 'var(--btn-on-bg)' },
  { kind: e => e.type === 'view_file' || e.type === 'download', hu: 'Fájl', en: 'File', color: 'var(--btn-bg)' },
];
function timelineChart(g, events) {
  const fresh = !TEACH.seen;
  if (fresh) TEACH.seen = new Set();
  const W = 1000, X0 = 80, X1 = W - 20, SH = 150, LH = 26, Y0 = 20, LY = Y0 + SH + 30, H = LY + TL_LANES.length * LH + 30;
  const t0 = +new Date(g.state.startedAt || (events[0] && events[0].at) || Date.now());
  const last = events.length ? +new Date(events[events.length - 1].at) : t0;
  const t1 = Math.max(g.closed ? last : Date.now(), t0 + 60000);
  const x = t => X0 + (X1 - X0) * (t - t0) / (t1 - t0);
  // score steps
  let sc = 0; const pts = [[X0, 0]];
  for (const e of events) if (e.type === 'submit' && e.data && e.data.ok) { const xx = x(+new Date(e.at)); pts.push([xx, sc]); sc += e.data.pts || 0; pts.push([xx, sc]); }
  pts.push([x(t1), sc]);
  const top = Math.max(100, Math.ceil(sc / 100) * 100), y = v => Y0 + SH - SH * v / top;
  const line = pts.map(([a, b]) => `${a.toFixed(1)},${y(b).toFixed(1)}`).join(' ');
  const len = Math.round(pts.reduce((a, p, i) => i ? a + Math.abs(p[0] - pts[i - 1][0]) + Math.abs(y(p[1]) - y(pts[i - 1][1])) : 0, 0)) + 1;
  // x ticks in minutes
  const mins = (t1 - t0) / 60000, step = [1, 2, 5, 10, 15, 30, 60, 120, 240].find(s => mins / s <= 8) || 480;
  let ticks = '';
  for (let m = 0; m <= mins; m += step) { const xx = x(t0 + m * 60000); ticks += `<line class="grid" x1="${xx}" x2="${xx}" y1="${Y0}" y2="${H - 24}"/><text x="${xx}" y="${H - 8}" text-anchor="middle">${m} ${L('p', 'm')}</text>`; }
  const yt = [0, top / 2, top].map(v => `<line class="grid" x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}"/><text x="${X0 - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
  const lanes = TL_LANES.map((ln, i) => `<text x="${X0 - 8}" y="${LY + i * LH + 4}" text-anchor="end">${L(ln.hu, ln.en)}</text><line class="grid" x1="${X0}" x2="${X1}" y1="${LY + i * LH}" y2="${LY + i * LH}"/>`).join('');
  let n = 0;
  const dots = events.map(e => {
    const i = TL_LANES.findIndex(ln => ln.kind(e)); if (i < 0) return '';
    const id = e.id != null ? e.id : e.at + e.type, isNew = !TEACH.seen.has(id); TEACH.seen.add(id);
    const delay = fresh ? Math.min(n++ * 60, 3000) : 0;
    return `<circle cx="${x(+new Date(e.at)).toFixed(1)}" cy="${LY + i * LH}" r="7" fill="${TL_LANES[i].color}" stroke="var(--white)" stroke-width="1.5"${isNew ? ` class="pop" style="animation-delay:${delay}ms"` : ''}><title>${esc(new Date(e.at).toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'hu-HU'))} · ${esc(L(...(EV_NAMES[e.type] || [e.type, e.type])))} · ${esc(evDetail(e))}</title></circle>`;
  }).join('');
  const nowLine = g.closed ? '' : `<line class="now" x1="${X1}" x2="${X1}" y1="${Y0}" y2="${H - 24}"/>`;
  return `<svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Idővonal-grafikon', 'Timeline chart')}">
    ${yt}${ticks}<text x="${X0}" y="${Y0 - 6}">${L('Pontszám', 'Score')}: ${sc}</text>
    <polygon class="area" points="${X0},${y(0)} ${line} ${x(t1)},${y(0)}"/>
    <polyline class="score${fresh ? ' draw' : ''}" style="--len:${len}" points="${line}"/>
    ${lanes}${dots}${nowLine}</svg>`;
}

  const delBar = TEACH.del
    ? `<div class="keybox row" style="margin-top:10px"><b>${TEACH.del === 'all' ? L(`Biztosan törlöd mind a ${TEACH.games.length} játszmát?`, `Delete all ${TEACH.games.length} games?`) : L(`Biztosan törlöd a kijelölt ${np} játszmát?`, `Delete the ${np} selected games?`)}</b><span class="hint">${L('Az eseménynaplójuk is törlődik, és ez nem vonható vissza.', 'Their event logs are deleted too, and this cannot be undone.')}</span>
       <button class="btn sm red" data-a="delyes">${L('Igen, törlés', 'Yes, delete')}</button><button class="btn sm ghost" data-a="delno">${L('Mégsem', 'Cancel')}</button></div>`
    : `<div class="row" style="margin-top:10px"><button class="btn sm red" data-a="delsel" ${np ? '' : 'disabled'}>${L('Kijelöltek törlése', 'Delete selected')} (${np})</button><button class="btn sm red" data-a="delall" ${TEACH.games.length ? '' : 'disabled'}>${L('Összes törlése', 'Delete all')}</button><span class="err">${esc(TEACH.msg)}</span></div>`;
  const dur = g => { const ms = new Date(g.updated_at) - new Date(g.state.startedAt); return isFinite(ms) ? Math.round(ms / 60000) + ' ' + L('perc', 'min') : '–'; };
  const hintsUsed = g => Object.values(g.state.hints || {}).reduce((a, h) => a + Object.values(h).reduce((x, y) => x + y, 0), 0);
  return `<div class="stack"><div class="frame cut"><div class="fi"><div class="row" style="justify-content:space-between"><h2>${L('Oktatói felület', 'Instructor view')}</h2><button class="btn sm" data-a="csv">${L('Összes esemény CSV-ben', 'All events as CSV')}</button></div>
   <table class="lb"><thead><tr><th><input type="checkbox" data-a="pickall" aria-label="${L('Összes kijelölése', 'Select all')}" ${allPicked ? 'checked' : ''}></th><th>${L('Játékos', 'Player')}</th><th>${L('Mód', 'Mode')}</th><th>${L('Réteg', 'Layer')}</th><th>${L('Pont', 'Points')}</th><th>${L('Tippek', 'Hints')}</th><th>${L('Idő', 'Time')}</th><th>${L('Állapot', 'State')}</th><th></th></tr></thead>
   <tbody>${TEACH.games.map(g => `<tr><td><input type="checkbox" data-a="pick" data-id="${g.id}" aria-label="${L('Kijelölés', 'Select')}: ${esc(g.username)}" ${TEACH.pick.has(g.id) ? 'checked' : ''}></td><td>${esc(g.username)}</td><td>${g.mode}</td><td>${g.layer}</td><td><b>${g.score}</b></td><td>${hintsUsed(g)}</td><td>${dur(g)}</td><td>${g.closed ? L('lezárva', 'closed') : L('aktív', 'active')}</td><td><button class="btn sm ghost" data-a="tsel" data-id="${g.id}">${L('Idővonal', 'Timeline')}</button></td></tr>`).join('') || `<tr><td colspan="9">${L('Még nincs játék.', 'No games yet.')}</td></tr>`}</tbody></table>${delBar}</div></div>
   ${sel ? `<div class="frame cut"><div class="fi stack"><div class="row" style="justify-content:space-between"><h2>${esc(sel.username)} · ${L('idővonal', 'timeline')}</h2>
     <div class="row"><span class="hint"><span class="live"></span>${L('Élő, 5 másodpercenként frissül', 'Live, refreshes every 5 seconds')} · ${TEACH.at.toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'hu-HU')}</span><button class="btn sm ghost" data-a="replay">${L('Visszajátszás', 'Replay')}</button></div></div>
    ${timelineChart(sel, TEACH.events)}
    <table class="lb"><thead><tr><th>${L('Idő', 'Time')}</th><th>${L('Esemény', 'Event')}</th><th>${L('Részletek', 'Details')}</th></tr></thead>
    <tbody>${TEACH.events.map(e => `<tr><td class="mono">${esc(new Date(e.at).toLocaleString(LANG === 'en' ? 'en-GB' : 'hu-HU'))}</td><td>${esc(L(...(EV_NAMES[e.type] || [e.type, e.type])))}</td><td class="mono">${esc(evDetail(e))}</td></tr>`).join('')}</tbody></table></div></div>` : ''}</div>`;
}
function evDetail(e) {
  const d = e.data || {};
  const parts = [];
  if (d.layer) parts.push(`L${d.layer}`);
  if (d.flag) parts.push(d.flag);
  if (d.file) parts.push(d.file);
  if (d.tier) parts.push(`${L('fokozat', 'tier')} ${d.tier}`);
  if ('ok' in d) parts.push(d.ok ? L('helyes', 'correct') : L('hibás', 'wrong') + (d.value ? `: "${d.value}"` : ''));
  if (d.pts != null) parts.push(`+${d.pts}`);
  if (d.mode) parts.push(d.mode);
  if (d.score != null) parts.push(`${d.score} ${L('pont', 'pts')}`);
  return parts.join(' · ');
}

  try {
    if (!USER) body = loginHTML();
    else if (VIEW === 'play' && GAME) body = playHTML();
    else if (VIEW === 'board') body = await boardHTML();
    else if (VIEW === 'teach') body = await teachHTML();
    else body = homeHTML();
  } catch (e) { body = `<div class="panel cut"><h3>${L('Hiba', 'Error')}</h3><p>${esc(e.message)}</p></div>`; }
  app.innerHTML = topHTML() + body;
  const f = document.getElementById('filter');
  if (f) f.oninput = () => { FILEVIEW.filter = f.value; const pos = f.selectionStart; render().then(() => { const g = document.getElementById('filter'); g.focus(); g.setSelectionRange(pos, pos); }); };
}

// ---------------------------------------------------------------- actions
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0]);
}

async function openLayer(k) {
  CUR = k; FILEVIEW = null; MSG = {};
  // Opening a later layer means the player has left the earlier ones: their remaining flags are halved from now on.
  if (k > (GAME.state.maxOpened || 1)) { GAME.state.maxOpened = k; await persist(); }
  await loadTask(GAME.state.tasks[k - 1]);
  if (k > 1) await loadTask(GAME.state.tasks[k - 2]);
  log('open_layer', { layer: k });
}

async function newGame(mode) {
  const side = SIDE;
  await loadIndex();
  // Prefer one whole chain (same story, ids differ only in the layer number) so each key fits the next layer's files;
  // fall back to drawing each layer separately when no complete chain exists.
  const cand = INDEX.tasks.filter(t => t.side === side && t.mode === mode);
  const chainOf = id => id.replace(/-L\d-/, '-');
  const chains = [...new Set(cand.map(t => chainOf(t.id)))].filter(c => [1, 2, 3, 4, 5, 6, 7].every(k => cand.some(t => t.layer === k && chainOf(t.id) === c)));
  const chain = chains.length ? chains[Math.floor(Math.random() * chains.length)] : null;
  const pick = k => { const c = cand.filter(t => t.layer === k && (!chain || chainOf(t.id) === chain)); return c[Math.floor(Math.random() * c.length)].id; };
  GAME = { id: uid(), side, mode, closed: false, score: 0, layer: 1,
    state: { tasks: [1, 2, 3, 4, 5, 6, 7].map(pick), flags: {}, hints: {}, keys: {}, unlocked: 1, maxOpened: 1, startedAt: new Date().toISOString() } };
  await persist();
  log('start', { side, mode, tasks: GAME.state.tasks });
  await openLayer(1);
  VIEW = 'play';
}

async function submit(fid) {
  const s = GAME.state, k = CUR, tid = s.tasks[k - 1], t = TASKS[tid];
  const inp = document.getElementById('ans-' + fid), val = inp ? inp.value.trim() : '';
  if (!val) return;
  const f = t.flags.find(x => x.id === fid);
  const ok = (await flagHash(tid, fid, val)) === f.hash;
  if (!ok) { MSG[fid] = L('Nem ez a válasz.', 'That is not the answer.'); log('submit', { layer: k, flag: fid, ok: false, value: val.slice(0, 120) }); return; }
  MSG[fid] = '';
  const late = (s.maxOpened || 1) > k;
  const pts = flagPoints(k, GAME.mode, (s.hints[tid] || {})[fid] || 0, late);
  (s.flags[tid] = s.flags[tid] || {})[fid] = { pts, late, ans: val, at: new Date().toISOString() };
  log('submit', { layer: k, flag: fid, ok: true, pts, late });
  const solved = t.flags.map(x => x.id).filter(id => s.flags[tid][id]);
  if (s.unlocked === k && solved.length >= 2) {
    const [a, b] = solved;
    s.keys[k] = await openKey(tid, a, b, s.flags[tid][a].ans, s.flags[tid][b].ans, t.keyOut.enc[`${a}+${b}`]);
    s.unlocked = k + 1;
    if (k < LAYERS) log('unlock', { layer: k + 1 });
    else { s.finishedAt = new Date().toISOString(); log('finish', {}); }
  }
  await persist();
}

async function hint(fid) {
  const s = GAME.state, tid = s.tasks[CUR - 1];
  const h = (s.hints[tid] = s.hints[tid] || {});
  h[fid] = (h[fid] || 0) + 1;
  log('hint', { layer: CUR, flag: fid, tier: h[fid] });
  await persist();
}

async function viewFile(name, raw) {
  const t = TASKS[GAME.state.tasks[CUR - 1]], f = t.files.find(x => x.name === name);
  const text = await getText(`${t._base}/files/${name}`);
  FILEVIEW = raw ? { name, kind: 'raw', text } : f.view === 'table' ? { name, kind: 'table', rows: parseCSV(text), sort: null, dir: 1 } : { name, kind: 'text', text };
  log(raw ? 'download' : 'view_file', { layer: CUR, file: name });
}

async function exportCSV() {
  const games = TEACH.games || await BACK.allGames();
  const lines = [['jatekos', 'jatek_id', 'mod', 'ido', 'esemeny', 'reszletek'].join(',')];
  for (const g of games) for (const e of await BACK.events(g.id))
    lines.push([g.username, g.id, g.mode, e.at, e.type, JSON.stringify(e.data || {})].map(x => `"${String(x).replace(/"/g, '""')}"`).join(','));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }));
  a.download = 'rvb_ctf_esemenyek.csv'; a.click();
}

async function credsAction(kind) {
  const u = document.getElementById('u').value.trim().toLowerCase(), p = document.getElementById('p').value;
  if (!USER_RE.test(u)) { MSG.login = L('Érvénytelen felhasználónév.', 'Invalid username.'); return; }
  if (p.length < 8) { MSG.login = L('A jelszó legalább 8 karakter legyen.', 'The password must be at least 8 characters.'); return; }
  try { USER = await (kind === 'register' ? BACK.register(u, p) : BACK.login(u, p)); MSG = {}; await afterLogin(); }
  catch (e) { MSG.login = e.message; }
}
async function afterLogin() {
  await loadIndex();
  const games = await BACK.myGames(USER);
  GAME = games.find(g => !g.closed) || null;
  VIEW = 'home';
}

app.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]'); if (!el || BUSY) return;
  const a = el.dataset.a;
  if (a === 'dl') {
    log('download', { layer: CUR, file: el.dataset.f });
    if (BUNDLE) {
      ev.preventDefault();
      const t = TASKS[GAME.state.tasks[CUR - 1]], d = document.createElement('a');
      d.href = URL.createObjectURL(new Blob([BUNDLE.files[`${t._base}/files/${el.dataset.f}`]], { type: 'text/plain' }));
      d.download = el.dataset.f; d.click();
    }
    return;
  }
  ev.preventDefault();
  BUSY = true;
  try {
    if (a === 'lang') { LANG = LANG === 'en' ? 'hu' : 'en'; try { localStorage.setItem('rvb-lang', LANG); } catch (e) { } }
    else if (a === 'login' || a === 'register') await credsAction(a);
    else if (a === 'logout') { await BACK.logout(); USER = GAME = null; VIEW = 'login'; }
    else if (a === 'home') VIEW = 'home';
    else if (a === 'board') VIEW = 'board';
    else if (a === 'teach') { VIEW = 'teach'; TEACH.sel = null; }
    else if (a === 'tsel') { TEACH.sel = el.dataset.id; TEACH.seen = null; }
    else if (a === 'replay') TEACH.seen = null;
    else if (a === 'pick') { const id = el.dataset.id; TEACH.pick.has(id) ? TEACH.pick.delete(id) : TEACH.pick.add(id); }
    else if (a === 'pickall') TEACH.pick = TEACH.pick.size === TEACH.games.length ? new Set() : new Set(TEACH.games.map(g => g.id));
    else if (a === 'delsel' || a === 'delall') { TEACH.del = a === 'delall' ? 'all' : 'sel'; TEACH.msg = ''; }
    else if (a === 'delno') TEACH.del = null;
    else if (a === 'delyes') {
      const ids = TEACH.del === 'all' ? 'all' : [...TEACH.pick];
      TEACH.del = null;
      try {
        const n = await BACK.deleteGames(ids);
        TEACH.msg = L(`${n} játszma törölve.`, `${n} games deleted.`);
        if (ids === 'all' || ids.includes(TEACH.sel)) TEACH.sel = null;
        TEACH.pick = new Set();
      } catch (e) { TEACH.msg = e.message; }
    }
    else if (a === 'csv') await exportCSV();
    else if (a === 'new') await newGame(el.dataset.mode);
    else if (a === 'resume') { await openLayer(Math.min(GAME.state.unlocked, LAYERS)); VIEW = 'play'; }
    else if (a === 'layer') await openLayer(+el.dataset.k);
    else if (a === 'submit') await submit(el.dataset.f);
    else if (a === 'hint') await hint(el.dataset.f);
    else if (a === 'file') await viewFile(el.dataset.f);
    else if (a === 'raw') await viewFile(el.dataset.f, true);
    else if (a === 'copy') {
      const msg = document.getElementById('copymsg'), pre = document.getElementById('rawtext');
      const selectAll = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
      try { await navigator.clipboard.writeText(FILEVIEW.text); msg.textContent = L('Kimásolva.', 'Copied.'); }
      catch (e) { selectAll(); msg.textContent = L('A szöveget kijelöltem, másold Ctrl+C-vel.', 'The text is selected; copy it with Ctrl+C.'); }
      BUSY = false; return;
    }
    else if (a === 'sort') { const i = +el.dataset.i; FILEVIEW.dir = FILEVIEW.sort === i ? -FILEVIEW.dir : 1; FILEVIEW.sort = i; }
    else if (a === 'close') CONFIRM_CLOSE = true;
    else if (a === 'closeno') CONFIRM_CLOSE = false;
    else if (a === 'closeyes') { CONFIRM_CLOSE = false; log('close', { score: GAME.score }); GAME.closed = true; await persist(); }
  } catch (e) { MSG.login = e.message; console.error(e); }
  BUSY = false;
  await render();
});
app.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const id = ev.target.id || '';
  if (id.startsWith('ans-')) document.querySelector(`[data-a=submit][data-f="${id.slice(4)}"]`).click();
  if (id === 'p') document.querySelector('[data-a=login]').click();
});

// Instructor view refreshes itself while it is open and the tab is visible.
setInterval(async () => {
  if (VIEW !== 'teach' || !USER || USER.role !== 'instructor' || BUSY || document.hidden) return;
  BUSY = true;
  try { await render(); } finally { BUSY = false; }
}, LIVE_MS);

(async () => {
  try { USER = await BACK.me(); if (USER) await afterLogin(); } catch (e) { USER = null; }
  await render();
})();
</script>
