<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://dpcemoeocpcvjwjutqfn.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red vs Blue CTF · Döntések</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Same look as the Red vs Blue app and CTF: industrial label (charcoal, warm beige, signal orange) on grid paper. */
:root{
  --ground:#ECE8E2; --paper:#D6CEC3; --ink:#232323; --mute:#6b655e; --char:#3e3e3e;
  --red:#FF3B12; --blue:#2F86DA; --white:#F6F3EE; --soft:#D9D2C8; --ok:#2a7d45; --warn:#b27a00; --bad:#B32506;
  --btn-bg:#3e3e3e; --btn-bg2:#525252; --btn-fg:#F6F3EE; --btn-on-bg:#FF3B12; --btn-on-fg:#1a1a1a;
  --f-body:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif; --f-mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  --stripes:repeating-linear-gradient(-55deg,var(--red) 0 7px,transparent 7px 13px);
  --on-ink:#F6F3EE; --field:#FBFAF7; --well:#D9D2C8; --gridline:rgba(35,35,35,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root[data-theme=dark]{
  --ground:#191919; --paper:#2a2a2a; --ink:#E8E2D8; --mute:#9a938a; --char:#121212;
  --white:#F2EEE7; --soft:#bdb6ab; --ok:#4fb874; --warn:#e0a92e; --bad:#FF7A55;
  --btn-bg:#454545; --btn-bg2:#575757;
  --on-ink:#161616; --field:#111; --well:#1f1f1f; --gridline:rgba(232,226,216,.05);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;
  background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
h1{font-size:clamp(26px,4.2vw,40px);line-height:1.02;letter-spacing:-.025em}
h2{font-size:21px}
h3{font-size:15px}
p{margin:0}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 48px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.mono{font-family:var(--f-mono)}
.hint{color:var(--mute);font-size:13px}
.cut{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.frame{background:var(--ink);padding:2px}
.frame>.fi{background:var(--paper);padding:16px 18px;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.panel{background:var(--char);color:var(--soft);padding:14px 16px;background-image:radial-gradient(rgba(246,243,238,.07) 1.2px,transparent 1.6px);background-size:14px 14px}
.panel h2,.panel h3{color:var(--white)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:0;background:var(--btn-bg);color:var(--btn-fg);padding:10px 16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:13px;text-decoration:none;display:inline-block;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:hover{background:var(--btn-bg2)}
.btn.hot{background:var(--btn-on-bg);color:var(--btn-on-fg)}
.btn.hot:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost:hover{background:var(--gridline)}
.panel .btn.ghost{color:var(--white);box-shadow:inset 0 0 0 2px var(--white)}
.btn.sm{padding:6px 10px;font-size:11px}
.btn[aria-pressed=true]{background:var(--btn-on-bg);color:var(--btn-on-fg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:10px;border-bottom:3px solid var(--ink);position:relative}
.top::after{content:'';position:absolute;left:0;bottom:-11px;width:120px;height:8px;background:var(--stripes)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;text-decoration:none}
.logo .r{color:var(--red)}.logo .b{color:var(--blue)}
.pill{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;padding:3px 8px;border:1.5px solid var(--ink)}
.theme{display:inline-flex;align-items:center;justify-content:center;min-width:34px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;padding:1px 6px;background:var(--char);color:var(--white);text-transform:uppercase}

/* ---------- home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:center}
.hero p{max-width:60ch;font-size:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .radar{display:none}}
.radar{width:100%;max-width:300px;aspect-ratio:1;justify-self:end}
.radar .sweep{transform-origin:150px 150px;animation:spin 4.5s linear infinite}
.radar .blip{animation:blip 4.5s linear infinite;opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,100%{opacity:0}5%{opacity:1}40%{opacity:.15}}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:18px}
.case{display:flex}.case>.fi{flex:1;display:flex;flex-direction:column;gap:10px}
.case .tree{height:86px;background:var(--char);margin:-16px -18px 4px;padding:8px 12px}
.case .tree svg{width:100%;height:100%;display:block}
.tree path{fill:none;stroke:#6b655e;stroke-width:2}
.tree path.hotp{stroke:var(--red);stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:trace 3.6s var(--ease) infinite}
.tree rect{fill:#8a847c}.tree rect.hotn{fill:var(--red);animation:pulse 1.8s ease-in-out infinite}
@keyframes trace{0%{stroke-dashoffset:var(--len)}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes pulse{50%{opacity:.35}}
.case .meta{display:flex;gap:6px;flex-wrap:wrap}
.case .stats{display:flex;justify-content:space-between;gap:8px;border-top:2px solid var(--ink);padding-top:8px;margin-top:auto;font-family:var(--f-mono);font-size:12px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.how h3{margin-bottom:6px}
.switch{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:700}
.switch .sw{width:44px;height:24px;background:var(--btn-bg);position:relative;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.switch .sw::after{content:'';position:absolute;top:4px;left:4px;width:16px;height:16px;background:var(--white);transition:transform .25s var(--ease)}
.switch[aria-checked=true] .sw{background:var(--btn-on-bg)}
.switch[aria-checked=true] .sw::after{transform:translateX(20px);background:var(--on-ink)}

/* ---------- play */
.play{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.play{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:10px}
@media (max-width:860px){.side{display:contents}.play>.scene{order:1}.side>.trailbox{order:2}.side>.abandon{order:3;justify-self:start}}
.clock{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.clock .hm{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--white);font-variant-numeric:tabular-nums;display:inline-block}
.clock .hm.tick{animation:roll .5s var(--ease)}
@keyframes roll{0%{transform:translateY(-40%);opacity:0}100%{transform:none;opacity:1}}
.dt{font-family:var(--f-mono);font-size:12px;color:var(--red);opacity:0}
.dt.show{animation:dtfade 2.2s ease-out}
@keyframes dtfade{0%{opacity:0;transform:translateY(6px)}15%,70%{opacity:1;transform:none}100%{opacity:0}}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
/* Analog round gauges: 270° dial, red danger zone 0–25, amber caution 25–40, needle with mechanical overshoot. */
.meter{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.meter svg{width:100%;max-width:104px;height:auto;display:block;overflow:visible}
.meter .face{fill:#1e1e1e;stroke:#6b655e;stroke-width:2}
.meter .bezel{fill:none;stroke:#2c2c2c;stroke-width:4}
.meter .tk{stroke:#bdb6ab;stroke-width:1.2}.meter .tk.mj{stroke:#F6F3EE;stroke-width:2}
.meter .arc{fill:none;stroke:#555;stroke-width:4}
.meter .arc.danger{stroke:#FF3B12;stroke-width:6}.meter .arc.warn{stroke:#e0a92e;stroke-width:5}
.meter .nl{font-family:var(--f-mono);font-size:9px;fill:#bdb6ab}
.meter .needle{transform-box:view-box;transform-origin:60px 60px;transition:transform 1.3s cubic-bezier(.34,1.56,.64,1)}
.meter .needle .nd{fill:var(--red)}
.meter .needle g{transform-box:view-box;transform-origin:60px 60px;animation:quiver 2.6s ease-in-out infinite}
.meter .hub{fill:#F6F3EE;stroke:#1e1e1e;stroke-width:2}
.meter .lamp{fill:#3a1a12;transition:fill .3s}
.meter.low .lamp{fill:#FF3B12;animation:pulse .8s ease-in-out infinite}
.meter .ro{font-family:var(--f-body);font-weight:800;font-size:18px;line-height:1;color:var(--white);font-variant-numeric:tabular-nums;margin-top:4px}
.meter.low .ro{color:#FF3B12}
.meter .mt{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter.down svg{animation:shake .45s .35s}
.meter.up .face{animation:glowup 1.2s .4s}.meter.down .face{animation:glowdown 1.2s .4s}
@keyframes glowup{30%{stroke:var(--ok);stroke-width:4}}
@keyframes glowdown{30%{stroke:var(--red);stroke-width:4}}
@keyframes quiver{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
@keyframes flashup{30%{background:var(--ok)}}
@keyframes flashdown{30%{background:var(--red)}}
@keyframes shake{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.score{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #5a5a5a;margin-top:12px;padding-top:8px}
.score b{font-size:26px;font-weight:800;color:var(--white);font-variant-numeric:tabular-nums}
.trail{list-style:none;margin:8px 0 0;padding:0}
.trail li{position:relative;padding:0 0 10px 22px;font-size:13px}
.trail li::before{content:'';position:absolute;left:5px;top:12px;bottom:-2px;width:2px;background:var(--ink);transform-origin:top;animation:grow .5s var(--ease) backwards}
.trail li:last-child::before{display:none}
.trail li::after{content:'';position:absolute;left:0;top:3px;width:12px;height:12px;background:var(--q,var(--ink))}
.trail li.cur::after{background:var(--red);animation:pulse 1.4s ease-in-out infinite}
.trail .tl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;display:block}
@keyframes grow{from{transform:scaleY(0)}}

.scene{min-width:0}
.scene.leave{animation:leave .28s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateX(-24px)}}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.phase{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;background:var(--ink);color:var(--paper)}
.feed{display:flex;flex-direction:column;gap:10px}
.msg{background:var(--field);border:2px solid var(--ink);padding:10px 12px 11px;position:relative;box-shadow:4px 4px 0 var(--ink)}
.msg .mh{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.msg .mh b{font-size:13px}
.msg.k-alert{border-left:8px solid var(--red)}
.msg.k-alert .tag{background:var(--red);color:#1a1a1a}
.msg.k-mail .tag{background:var(--blue)}
.msg.k-news .tag{background:#7a3db8}
.msg.k-memo{background:var(--well)}
.msg.k-memo p{font-family:var(--f-mono);font-size:13px}
.msg.k-phone .tag::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px;animation:pulse 1s ease-in-out infinite}
.typing{display:inline-flex;gap:4px;padding:10px 12px;background:var(--field);border:2px solid var(--ink);width:max-content}
.typing i{width:7px;height:7px;background:var(--ink);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.rv{opacity:0}
.rv.in{opacity:1;animation:rise .45s var(--ease) backwards}
.msg.rv.in{animation:slidein .5s var(--ease) backwards}
.msg.k-alert.rv.in{animation:slidein .5s var(--ease) backwards,glitch .6s steps(2) .1s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes slidein{from{opacity:0;transform:translateX(-26px)}}
@keyframes glitch{0%{filter:none}25%{transform:translateX(3px);filter:hue-rotate(40deg)}50%{transform:translateX(-3px)}75%{transform:translateX(1px);filter:none}100%{transform:none}}
.sit{font-size:17px;font-weight:600}
.timer{display:flex;align-items:center;gap:10px}
.timer .tb{flex:1;height:10px;background:var(--well);border:2px solid var(--ink);overflow:hidden}
.timer .tb i{display:block;height:100%;background:var(--ink);width:100%}
.timer.hurry .tb i{background:var(--red)}
.timer.hurry .ts{color:var(--bad);animation:pulse .7s ease-in-out infinite}
.timer .ts{font-family:var(--f-mono);font-size:14px;min-width:4ch;text-align:right;font-weight:700}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:0;background:var(--char);color:var(--white);padding:12px 14px;font-size:15px;font-weight:600;position:relative;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:transform .2s var(--ease),background .2s,opacity .35s}
.choice .key{font-family:var(--f-mono);font-size:20px;display:flex;align-items:center;justify-content:center;width:38px;height:38px;background:var(--btn-bg2);color:var(--white);transition:background .2s}
.choice:hover:not([disabled]){transform:translateX(6px)}
.choice:hover:not([disabled]) .key{background:var(--red);color:#1a1a1a}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.35}
.choice.picked{background:var(--btn-on-bg);color:#1a1a1a;transform:translateX(6px);padding-right:104px}
.choice.picked .key{background:#1a1a1a;color:var(--btn-on-bg)}
.choice .stamp{position:absolute;right:12px;top:50%;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;padding:2px 6px;border:2px solid #1a1a1a;transform:translateY(-50%) rotate(-6deg);animation:stampin .35s var(--ease)}
@keyframes stampin{from{transform:translateY(-50%) rotate(-6deg) scale(2.4);opacity:0}}
.result{border-top:3px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:10px;animation:rise .5s var(--ease) backwards}
.qual{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qual .q{font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:4px 10px;color:#fff}
.q.best{background:var(--ok)}.q.ok{background:var(--warn);color:#1a1a1a}.q.risky{background:#c2561c}.q.poor{background:var(--bad)}
.qual .pts{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;animation:pop .6s cubic-bezier(.3,1.6,.5,1) backwards .15s}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:2px solid currentColor;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.chip.up{color:var(--ok)}.chip.down{color:var(--bad)}
.chip.t{color:var(--mute)}
.fb{font-size:16px}
.timeout{font-weight:700;color:var(--bad)}
.skip{align-self:flex-end}

/* ---------- ending */
.endcard{position:relative;overflow:hidden}
.endhead{display:grid;grid-template-columns:130px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:560px){.endhead{grid-template-columns:1fr}}
.grade{width:130px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:5px solid currentColor;transform:rotate(-8deg);animation:stamp .7s cubic-bezier(.2,1.4,.4,1) backwards .2s}
.grade b{font-size:74px;line-height:.9;font-weight:800}
.grade .lbl{font-size:10px}
.g-S{color:var(--ok)}.g-A{color:var(--blue)}.g-B{color:var(--warn)}.g-C{color:#c2561c}.g-F{color:var(--bad)}
@keyframes stamp{0%{transform:rotate(-8deg) scale(3);opacity:0}60%{opacity:1}100%{transform:rotate(-8deg) scale(1)}}
.endcard.thud{animation:shake .4s .55s}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.breakdown div{background:var(--char);color:var(--soft);padding:10px 12px}
.breakdown b{display:block;font-size:24px;color:var(--white);font-variant-numeric:tabular-nums}
.breakdown .tot{background:var(--btn-on-bg);color:#1a1a1a}.breakdown .tot b{color:#1a1a1a}
.ends{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.endt{border:2px solid var(--ink);padding:8px 10px;font-size:13px;min-height:62px;display:flex;flex-direction:column;gap:2px;animation:rise .4s var(--ease) backwards}
.endt.lock{border-style:dashed;color:var(--mute)}
.endt.now{box-shadow:inset 0 0 0 3px var(--red)}
.endt .gl{font-weight:800;font-size:18px}
.debrief{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.debrief li{position:relative;padding:0 0 18px 30px;animation:rise .45s var(--ease) backwards}
.debrief li::before{content:'';position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--ink)}
.debrief li:last-child::before{display:none}
.debrief li::after{content:'';position:absolute;left:0;top:4px;width:16px;height:16px;background:var(--q,var(--ink))}
.debrief .you{margin:4px 0}
.debrief .lesson{background:var(--well);border-left:4px solid var(--blue);padding:8px 10px;font-size:14px;margin-top:6px}
.debrief .alt{font-size:14px;margin-top:6px}
:root{--gS:var(--ok);--gA:var(--blue);--gB:var(--warn);--gC:#c2561c;--gF:var(--bad);--qbest:var(--ok);--qok:var(--warn);--qrisky:#c2561c;--qpoor:var(--bad)}

/* ---------- decision tree on the ending screen */
.treewrap{overflow-x:auto;border:2px solid var(--ink);background:var(--char);background-image:radial-gradient(rgba(246,243,238,.07) 1.2px,transparent 1.6px);background-size:14px 14px}
svg.dtree{display:block;font-family:var(--f-mono)}
.dtree .e{fill:none;stroke:#6b655e;stroke-width:1.6;stroke-dasharray:3 4;opacity:.75}
.dtree .e.go{opacity:1;stroke-width:4;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:tdraw .5s var(--ease) forwards}
.dtree .alt,.dtree .hd,.dtree .pk{animation:tfade .4s var(--ease) backwards}
.dtree .alt circle{fill:var(--char);stroke-width:1.5}
.dtree .n rect,.dtree .n circle{fill:#4a4742;stroke:#6b655e;stroke-width:1.5}
.dtree .n.seen rect{fill:#F6F3EE;stroke:#F6F3EE}
.dtree .n.cur circle{stroke-width:3}
.dtree .n.go,.dtree .n.end{animation:tpop .4s cubic-bezier(.3,1.6,.5,1) backwards;transform-box:fill-box;transform-origin:center}
.dtree text{font-size:10px;fill:#9a938a}
.dtree .hd text{fill:#F6F3EE}.dtree .hd .sn{fill:var(--red);font-weight:700;letter-spacing:.15em}
.dtree .et{font-size:11px}.dtree .et.now{fill:#F6F3EE;font-weight:700}

.turn{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-left:6px solid var(--warn);background:rgba(201,138,0,.12);animation:tfade .5s var(--ease) backwards}
.turn.cascade{border-left-color:var(--red);background:rgba(255,59,18,.1)}

.savebar.ok{border-left-color:var(--ok)}.savebar.err{border-left-color:var(--bad)}
.who{font-family:var(--f-mono);font-size:12px}

  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1}
}

<body>
<div class="wrap" id="app"></div>
<script>
'use strict';
// ---------------------------------------------------------------- basics
const CASES = window.IR_CASES, FAIL = window.IR_FAIL, E = window.IR_ENGINE;
let LANG = (() => { try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'hu') return q; return localStorage.getItem('rvb-lang') === 'en' ? 'en' : 'hu'; } catch (e) { return 'hu'; } })();
const L = (hu, en) => LANG === 'en' ? en : hu;
const T = o => o ? (o[LANG] || o.hu || '') : '';
let DARK = document.documentElement.dataset.theme === 'dark';
const MOON = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M20 15.5A8.5 8.5 0 0 1 8.5 4a8.5 8.5 0 1 0 11.5 11.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
};
const RM = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const app = document.getElementById('app');
// Standalone build: links back to the menu cannot be relative.
const MENU_URL = window.IR_MENU_URL || '../../index.html', CTF_URL = window.IR_CTF_URL || '../';

// ---------------------------------------------------------------- labels
const METER_NAME = { ops: ['Működés', 'Operations'], ev: ['Bizonyítékok', 'Evidence'], trust: ['Bizalom', 'Trust'] };
const PHASE = { det: ['Észlelés és elemzés', 'Detection & analysis'], cont: ['Elszigetelés', 'Containment'], erad: ['Felszámolás', 'Eradication'],
  rec: ['Helyreállítás', 'Recovery'], comm: ['Kommunikáció és bejelentés', 'Communication & reporting'], post: ['Tanulságok', 'Lessons learned'] };
const KIND = { phone: ['Hívás', 'Call'], mail: ['E-mail', 'Email'], chat: ['Üzenet', 'Message'], alert: ['Riasztás', 'Alert'], news: ['Hír', 'News'], memo: ['Dokumentum', 'Document'] };
const DAYS = [['Hétfő', 'Monday'], ['Kedd', 'Tuesday'], ['Szerda', 'Wednesday'], ['Csütörtök', 'Thursday'], ['Péntek', 'Friday'], ['Szombat', 'Saturday'], ['Vasárnap', 'Sunday']];
const quality = p => p >= 90 ? 'best' : p >= 50 ? 'ok' : p >= 20 ? 'risky' : 'poor';
const QNAME = { best: ['Kiváló döntés', 'Best call'], ok: ['Elfogadható', 'Acceptable'], risky: ['Kockázatos', 'Risky'], poor: ['Rossz döntés', 'Poor call'] };
const GRADE_NAME = { S: ['Kiváló', 'Outstanding'], A: ['Jó', 'Good'], B: ['Közepes', 'Fair'], C: ['Gyenge', 'Weak'], F: ['Kudarc', 'Failure'] };
const pad = n => String(n).padStart(2, '0');
function clockOf(c, t) {
  const abs = c.start.min + t, day = Math.floor(abs / 1440), m = abs % 1440;
  return { day: DAYS[(c.start.dow + day) % 7], hm: `${pad(Math.floor(m / 60))}:${pad(m % 60)}` };
}
function durText(min) {
  if (min < 60) return `${min} ${L('perc', 'min')}`;
  const h = Math.round(min / 60);
  return h < 48 ? `${h} ${L('óra', 'h')}` : `${Math.round(h / 24)} ${L('nap', 'days')}`;
}
// Options appear in a random order per game (stored in the run, so a reload keeps it); letters follow the shown order.
function orderOf(run, id) {
  run.perm = run.perm || {};
  if (!run.perm[id]) {
    const a = caseOf(run.cid).nodes[id].choices.map((_, i) => i);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    run.perm[id] = a; save();
  }
  return run.perm[id];
}
const letterOf = (run, id, i) => String.fromCharCode(65 + ((run.perm && run.perm[id]) ? run.perm[id].indexOf(i) : i));
// The options as the player saw them: shuffled, without the ones hidden by hideIf. Each decision keeps
// the order it was shown in (h.ord), because a revisited node can show fewer options.
function shownOrder(run, id) {
  const last = run.hist[run.hist.length - 1];
  if (run.show && last && last.ord) return last.ord;
  const v = E.visible(caseOf(run.cid), run, id);
  return orderOf(run, id).filter(i => v.includes(i));
}
const ordOf = (run, h) => h.ord || orderOf(run, h.node);
const letterIn = (ord, i) => String.fromCharCode(65 + Math.max(0, ord.indexOf(i)));
// A turn of the story after a decision: an earlier decision's delayed consequence surfaces (echo), or several
// of them have piled up (cascade). Time never jumps; the consequence opens an extra challenge.
const TURN = { echo: ['⚠', 'Késleltetett következmény', 'Delayed consequence'], cascade: ['⛓', 'Halmozódó következmények', 'Compounding consequences'] };
// The earlier decisions (indexes into run.hist, before k) that caused turn t of decision k.
function causesOf(c, run, k, t) {
  const b = c.nodes[t.at].go[t.b];
  if (t.kind === 'cascade') return run.hist.slice(0, k + 1).map((h, j) => (h.turns || []).some(x => x.kind === 'echo') ? j : -1).filter(j => j >= 0);
  return run.hist.slice(0, k + 1).map((h, j) => ((c.nodes[h.node].choices[h.i].set || []).some(f => (b.any || []).includes(f)) ? j : -1)).filter(j => j >= 0);
}
function turnsHTML(c, run, k, delay) {
  const h = run.hist[k];
  return (h.turns || []).map(t => {
    const cs = causesOf(c, run, k, t).map(j => `${pad(j + 1)} · ${T(c.nodes[run.hist[j].node].title)}`).join('; ');
    return `<div class="turn ${t.kind}" style="animation-delay:${delay}s"><b>${TURN[t.kind][0]} ${L(TURN[t.kind][1], TURN[t.kind][2])}${t.pts ? ` · ${t.pts > 0 ? '+' : '−'}${Math.abs(t.pts)} ${L('pont', 'pts')}` : ''}</b><span>${esc(T(c.nodes[t.at].go[t.b].note))}</span>${cs ? `<span class="cause">${t.kind === 'cascade' ? L('Halmozódott', 'Piled up from') : L('Előzmény', 'Caused by')}: ${esc(cs)}</span>` : ''}</div>`;
  }).join('');
}
const elapsedText = t => `T+${pad(Math.floor(t / 60))}:${pad(t % 60)}`;

// ---------------------------------------------------------------- state
const KEY = 'rvb-dontes-v1';
let DATA = store.get(KEY) || { stats: {}, run: null };
// a run saved before the cases were rewritten (v1) or pointing to a node that no longer exists is dropped
if (DATA.run && (DATA.run.v !== 3 || !window.IR_CASES.some(c => c.id === DATA.run.cid && (DATA.run.end || c.nodes[DATA.run.node])))) DATA.run = null;
if (!DATA.v3) { DATA.stats = {}; DATA.v2 = DATA.v3 = true; }   // endings and best scores of the old cases no longer apply
let TIMED = store.get('rvb-dontes-timer'); if (TIMED == null) TIMED = true;
let VIEW = DATA.run ? 'play' : 'home';
const REACH = {};               // case id -> { max, ends } (exploring every path is the checker's job)
CASES.forEach(c => { REACH[c.id] = E.reach(c, FAIL); });
const caseOf = id => CASES.find(c => c.id === id);
const save = () => store.set(KEY, DATA);
// ---------------------------------------------------------------- CTF account + leaderboard
// Results go into the same games table / local store as the CTF tracks (side = 'dontes'), under the
// account the player is logged in with on the CTF page. Nothing is sent without a logged-in account.
const CFG = window.CTF_CONFIG || {};
const SB = CFG.supabaseUrl && CFG.supabaseAnonKey ? { url: CFG.supabaseUrl.replace(/\/$/, ''), key: CFG.supabaseAnonKey } : null;
let USER = null;                // {id, username} or null
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => { const r = Math.random() * 16 | 0; return (ch === 'x' ? r : (r & 3 | 8)).toString(16); }));
async function sbRefresh() {
  const s = store.get('rvbctf-sb'); if (!s) return false;
  try {
    const r = await fetch(`${SB.url}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: { apikey: SB.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    if (!r.ok) throw new Error(r.statusText);
    const j = await r.json(); store.set('rvbctf-sb', { ...s, access_token: j.access_token, refresh_token: j.refresh_token }); return true;
  } catch (e) { store.set('rvbctf-sb', null); return false; }
}
async function sbRest(path, opt = {}, retry = true) {
  const s = store.get('rvbctf-sb'); if (!s) throw new Error('login');
  const r = await fetch(`${SB.url}/rest/v1/${path}`, { ...opt, headers: { apikey: SB.key, Authorization: `Bearer ${s.access_token}`, 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  if (r.status === 401 && retry && await sbRefresh()) return sbRest(path, opt, false);
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || r.statusText);
  return j;
}
async function whoAmI() {
  if (SB) {
    const s = store.get('rvbctf-sb'); if (!s) return null;
    try { const p = await sbRest(`profiles?id=eq.${s.uid}&select=id,username`); return p[0] || null; } catch (e) { return null; }
  }
  const s = store.get('rvbctf-session'), us = store.get('rvbctf-users') || {};
  return s && us[s.username] ? { id: us[s.username].id, username: s.username } : null;
}
function resultRow(c, run) {
  const sc = E.finalScore(c, run, FAIL);
  return { id: uuid(), side: 'dontes', mode: run.timed ? 'hard' : 'easy', score: sc.total, layer: Math.max(1, Math.min(7, run.hist.length)), closed: true,
    state: { kind: 'dontes', cid: c.id, end: run.end, grade: sc.grade, startedAt: run.startedAt || null, finishedAt: new Date().toISOString(), hist: run.hist.map(h => [h.node, h.i, h.pts]) } };
}
async function uploadRow(row) {
  if (SB) await sbRest('games', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ ...row, user_id: USER.id }) });
  else { const all = store.get('rvbctf-games') || []; all.push({ ...row, user_id: USER.id, username: USER.username, updated_at: new Date().toISOString() }); store.set('rvbctf-games', all); }
}
// The finished result waits in DATA.unsaved until it is saved; saving needs a logged-in account and,
// for a result finished while logged out, the player's explicit click (shared lab computers).
async function saveResult(explicit) {
  const u = DATA.unsaved; if (!u || !USER) return;
  if (u.user && u.user !== USER.username && !explicit) return;
  u.status = 'saving'; refreshSaveBar();
  try { await uploadRow(u.row); DATA.unsaved = null; DATA.lastSaved = { cid: u.row.state.cid, user: USER.username, score: u.row.score }; }
  catch (e) { u.status = 'err'; u.err = e.message; DATA.unsaved = u; }
  save(); refreshSaveBar();
}
function saveBarHTML() {
  const u = DATA.unsaved, ls = DATA.lastSaved, ctf = esc(CTF_URL);
  if (u && u.status === 'saving') return `<div class="savebar" id="savebar">${L('Mentés a ranglistára…', 'Saving to the leaderboard…')}</div>`;
  if (u && u.status === 'err') return `<div class="savebar err" id="savebar">${L('Nem sikerült menteni', 'Could not save')}: ${esc(u.err)}<button class="btn sm" data-a="saveres">${L('Újra', 'Retry')}</button></div>`;
  if (u && USER) return `<div class="savebar" id="savebar">${L('Ez az eredmény még nincs a ranglistán.', 'This result is not on the leaderboard yet.')}<button class="btn sm hot" data-a="saveres">${L('Mentés', 'Save as')} ${esc(USER.username)}${L(' néven', '')}</button></div>`;
  if (u) return `<div class="savebar" id="savebar">${L('A ranglistához lépj be a CTF-fiókoddal, utána itt mentheted ezt az eredményt.', 'Log in with your CTF account to put this result on the leaderboard; then you can save it here.')}<a class="btn sm" href="${ctf}">${L('Belépés a CTF-be', 'Log in to CTF')}</a></div>`;
  if (ls && DATA.run && ls.cid === DATA.run.cid) return `<div class="savebar ok" id="savebar">✓ ${L('Mentve a ranglistára', 'Saved to the leaderboard')} (${esc(ls.user)}, ${ls.score} ${L('pont', 'pts')}).<a class="btn sm ghost" href="${ctf}#ranglista">${L('Ranglista', 'Leaderboard')}</a></div>`;
  return '';
}
function refreshSaveBar() { const el = document.getElementById('savebar'); if (el) el.outerHTML = saveBarHTML() || '<div id="savebar"></div>'; }

// ---------------------------------------------------------------- decision tree (ending screen)
// Left to right: every decision of the run fans out into all its options (in the order they were shown);
// the chosen one, coloured by quality, carries on to the next decision and finally to the ending reached.
// The last column lists every ending of the case: found ones with their grade, the rest as "?".
function treeHTML(c, run, animate) {
  const anim = animate && !RM(), st = stats(c.id), ends = E.endingIds(c, REACH[c.id].ends);
  const endOf = id => id.startsWith('fail:') ? FAIL[id.slice(5)] : c.nodes[id], endTitle = id => T(endOf(id).title), gradeOf = id => endOf(id).end;
  const CW = 160, OS = 26, X0 = 84, steps = run.hist.length;
  const maxOpt = Math.max(...run.hist.map(h => ordOf(run, h).length));
  const ER = 30, fanH = (maxOpt - 1) * OS, endH = (ends.length - 1) * ER;
  const nTurns = run.hist.reduce((a, h) => a + (h.turns || []).length, 0);
  const Y = (nTurns ? 76 + 10 * Math.min(nTurns, 4) : 58) + Math.max(fanH, endH) / 2, H = Y + Math.max(fanH, endH) / 2 + 34;
  const XE = X0 + steps * CW + 40, W = XE + 230;
  const at = k => anim ? `animation-delay:${(.25 + k * .4).toFixed(2)}s` : 'animation:none;stroke-dashoffset:0';
  const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`; };
  const len = (x1, y1, x2, y2) => Math.round(Math.hypot(x2 - x1, y2 - y1) * 1.2 + 4);
  const short = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  let g = '', lastX = X0, lastY = Y, ti = 0;
  const pickY = run.hist.map(h => { const o = ordOf(run, h); return Y + (o.indexOf(h.i) - (o.length - 1) / 2) * OS; });
  run.hist.forEach((h, k) => {
    const n = c.nodes[h.node], x = X0 + k * CW, ord = ordOf(run, h), px = x + CW * .5;
    g += `<g class="hd" style="${at(k)}"><text class="sn" x="${x}" y="18" text-anchor="middle">${pad(k + 1)}${k && (run.hist[k - 1].turns || []).length ? ` ${TURN[run.hist[k - 1].turns[0].kind][0]}` : ''}</text><text x="${x}" y="32" text-anchor="middle">${esc(short(T(n.title), 22))}</text></g>`;
    ord.forEach((i, j) => {
      const ch = n.choices[i], y = Y + (j - (ord.length - 1) / 2) * OS, col = `var(--q${quality(ch.pts)})`, L1 = String.fromCharCode(65 + j);
      if (i === h.i) {
        const nx = k + 1 < steps ? X0 + (k + 1) * CW - 10 : null;
        const d = curve(x + 10, Y, px, y) + (nx ? ` C${(px + nx) / 2} ${y} ${(px + nx) / 2} ${Y} ${nx} ${Y}` : '');
        g += `<path class="e go" d="${d}" style="stroke:${col};--len:${len(x, Y, px, y) + (nx ? len(px, y, nx, Y) : 0)};${at(k)}"/>`;
        g += `<g class="pk" style="${at(k + .5)}"><circle cx="${px}" cy="${y}" r="6" style="fill:${col}"/><text class="ql" x="${px}" y="${y - 10}" text-anchor="middle" style="fill:${col}">${L1} · ${ch.pts}${h.timeout ? ' ⏱' : ''}</text></g>`;
        lastX = px; lastY = y;
        // delayed consequences: a dashed arc from the decision(s) that caused it to this one
        (h.turns || []).forEach(t => {
          const top = 46 + 10 * (ti++ % 4), col = t.kind === 'cascade' ? 'var(--red)' : 'var(--warn)';
          for (const j of causesOf(c, run, k, t)) {
            const tx = X0 + j * CW + CW * .5;
            if (tx === px) continue;
            g += `<path class="tb" d="M${tx} ${pickY[j] - 22} C${tx} ${top} ${tx} ${top} ${tx + 24} ${top} L${px - 24} ${top} C${px} ${top} ${px} ${top} ${px} ${y - 22}" style="stroke:${col};${anim ? `animation:tfade .5s ${(.25 + (k + .6) * .4).toFixed(2)}s backwards` : ''}"/>`;
          }
          g += `<text class="tl2" x="${px - 28}" y="${top - 5}" text-anchor="end" style="fill:${col}">${TURN[t.kind][0]} ${t.kind === 'cascade' ? L('halmozódás', 'compounding') : L('visszaüt', 'strikes back')} ${t.pts}</text>`;
        });
      } else {
        g += `<g class="alt" style="${at(k)}"><path class="e" d="${curve(x + 10, Y, px - 6, y)}" style="stroke:${col}"/><circle cx="${px}" cy="${y}" r="4" style="stroke:${col}"/><text x="${px + 9}" y="${y + 3.5}">${L1}</text></g>`;
      }
    });
    g += `<g class="n seen go" style="${at(k)}"><title>${esc(T(n.title))}</title><rect x="${x - 10}" y="${Y - 10}" width="20" height="20"/></g>`;
  });
  ends.forEach((id, j) => {
    const y = Y + (j - (ends.length - 1) / 2) * ER, known = st.ends.includes(id), cur = id === run.end, gr = gradeOf(id);
    if (cur) g += `<path class="e go" d="${curve(lastX + 6, lastY, XE - 14, y)}" style="stroke:var(--g${gr});--len:${len(lastX, lastY, XE, y)};${at(steps)}"/>`;
    else g += `<path class="e" d="${curve(lastX + 6, lastY, XE - 14, y)}" style="opacity:.35;${anim ? `animation:tfade .4s ${(.25 + steps * .4).toFixed(2)}s backwards` : ''}"/>`;
    g += `<g class="n end${cur ? ' cur go' : ''}" style="${at(steps + .4)}"><title>${known ? esc(endTitle(id)) : L('Még nem találtad meg', 'Not found yet')}</title><circle cx="${XE}" cy="${y}" r="12" style="${known ? `fill:var(--g${gr});stroke:${cur ? 'var(--red)' : `var(--g${gr})`}` : ''}"/><text class="gl" x="${XE}" y="${y + 5}" text-anchor="middle" style="${known ? '' : 'fill:#9a938a'}">${known ? gr : '?'}</text>
      <text class="et${cur ? ' now' : ''}" x="${XE + 20}" y="${y + 4}">${known ? esc(short(endTitle(id), 26)) : L('még nem találtad meg', 'not found yet')}</text></g>`;
  });
  return `<div class="treewrap"><svg class="dtree" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${L('Döntési fa: a döntéseid, a kihagyott lehetőségek és az eset befejezései', 'Decision tree: your decisions, the options you passed on and the endings of the case')}">${g}</svg></div>
   <div class="legend"><span><i style="background:var(--qbest)"></i>${L('kiváló', 'best')}</span><span><i style="background:var(--qok)"></i>${L('elfogadható', 'acceptable')}</span><span><i style="background:var(--qrisky)"></i>${L('kockázatos', 'risky')}</span><span><i style="background:var(--qpoor)"></i>${L('rossz', 'poor')}</span><span>${L('vastag vonal: a te utad, szaggatott: a nem választott lehetőség', 'thick line: your path, dashed: an option you did not pick')}</span><span>⚠ ${L('késleltetett következmény: a korábbi döntésből induló ív', 'delayed consequence: the arc from the earlier decision')} · ⛓ ${L('halmozódás', 'compounding')}</span></div>`;
}

let GEN = 0;                    // bumps on every render: stops old reveal sequences and timers
let TIMER = null;

// ---------------------------------------------------------------- top bar

// A small decision tree per case; one path (seeded by the case) is traced in orange, looping.
function treeSVG(seed) {
  let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const cols = [14, 96, 178, 260, 342], rows = [14, 38, 62];
  let path = [1], lines = '', nodes = '';
  for (let i = 1; i < cols.length; i++) path.push(Math.floor(rnd() * 3));
  for (let i = 0; i < cols.length - 1; i++) for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) {
    if (i === 0 && a !== 1) continue;
    if (Math.abs(a - b) > 1 && rnd() < .6) continue;
    lines += `<path d="M${cols[i]} ${rows[a]} H${(cols[i] + cols[i + 1]) / 2} V${rows[b]} H${cols[i + 1]}"/>`;
  }
  let d = `M${cols[0]} ${rows[1]}`, len = 0;
  for (let i = 1; i < cols.length; i++) { const x0 = cols[i - 1], mx = (x0 + cols[i]) / 2; d += ` H${mx} V${rows[path[i]]} H${cols[i]}`; len += (cols[i] - x0) + Math.abs(rows[path[i]] - rows[path[i - 1]]); }
  cols.forEach((x, i) => rows.forEach((y, j) => { if (i === 0 && j !== 1) return; nodes += `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" class="${path[i] === j ? 'hotn' : ''}" style="animation-delay:${i * .3}s"/>`; }));
  return `<svg viewBox="0 0 356 76" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${lines}<path class="hotp" d="${d}" style="--len:${len + 10}"/>${nodes}</svg>`;
}

const ang = v => -135 + v * 2.7;           // 0 → -135°, 100 → +135°
function arcPath(r, a0, a1) {
  const pt = a => { const t = (a - 90) * Math.PI / 180; return `${(60 + r * Math.cos(t)).toFixed(2)} ${(60 + r * Math.sin(t)).toFixed(2)}`; };
  return `M${pt(a0)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${pt(a1)}`;
}
// Static dial face, built once: scale arcs, ticks every 10, numbers every 50.
const DIAL = (() => {
  let t = '';
  for (let v = 0; v <= 100; v += 5) {
    const a = (ang(v) - 90) * Math.PI / 180, mj = v % 50 === 0, r0 = mj ? 37 : v % 10 === 0 ? 40 : 42;
    t += `<line class="tk${mj ? ' mj' : ''}" x1="${(60 + r0 * Math.cos(a)).toFixed(2)}" y1="${(60 + r0 * Math.sin(a)).toFixed(2)}" x2="${(60 + 45 * Math.cos(a)).toFixed(2)}" y2="${(60 + 45 * Math.sin(a)).toFixed(2)}"/>`;
    if (mj) t += `<text class="nl" x="${(60 + 29 * Math.cos(a)).toFixed(1)}" y="${(60 + 29 * Math.sin(a) + 3).toFixed(1)}" text-anchor="middle">${v}</text>`;
  }
  return `<circle class="bezel" cx="60" cy="60" r="56"/><circle class="face" cx="60" cy="60" r="53"/>
   <path class="arc" d="${arcPath(48, ang(40), ang(100))}"/><path class="arc warn" d="${arcPath(48, ang(25), ang(40))}"/><path class="arc danger" d="${arcPath(48, ang(0), ang(25))}"/>${t}`;
})();

</svg>

// The status panel shows the state before the last choice while its consequence is being shown, so the change can animate.
function prevRun(run) {
  if (!run.show) return run;
  const h = run.hist[run.hist.length - 1], m = { ...run.m };
  for (const k in h.d) m[k] -= h.d[k];
  return { ...run, m, pts: run.pts - (h.gain != null ? h.gain : h.pts) - (h.rp || 0), t: run.hist.length > 1 ? run.hist[run.hist.length - 2].t : 0, hist: run.hist.slice(0, -1) };
}
function playHTML(animate) {
  const run = DATA.run, c = caseOf(run.cid);
  const node = c.nodes[run.show ? run.show.node : run.node];
  const shownRun = run.show && animate ? prevRun(run) : run;
  return `<div class="play">${sideHTML(c, run, shownRun, run.show ? (animate ? node : null) : node)}${sceneHTML(c, run, node, !animate || RM() || !!run.show)}</div>`;
}

    <div class="row"><button class="btn hot" data-a="start" data-c="${c.id}">${L('Újrajátszás', 'Play again')}</button><button class="btn ghost" data-a="home">${L('Másik eset', 'Another case')}</button></div>
   </div></section>
   <section class="frame cut"><div class="fi stack"><div><h2>${L('Döntési fa', 'Decision tree')}</h2><p class="hint" style="margin-top:4px">${L('Lépésenként minden lehetőség, a döntés minősége szerint színezve. A vastag vonal a te utad, jobb szélen az eset befejezései; a többit egy újabb játékban fedezheted fel. Az ábra oldalra görgethető.', 'Every option, step by step, coloured by the quality of the decision. The thick line is your path, the endings of the case are on the right; find the others in another game. The chart scrolls sideways.')}</p></div>${treeHTML(c, run, animate)}</div></section>
   <section class="frame cut"><div class="fi stack"><h2>${L('Visszajátszás és tanulságok', 'Replay and lessons')}</h2><ol class="debrief">${deb}</ol></div></section>
  </main>`;
}

// ---------------------------------------------------------------- render + animation
function stopTimer() { if (TIMER) { clearInterval(TIMER); TIMER = null; } }
function render(animate = false) {
  GEN++; stopTimer();
  document.documentElement.lang = LANG;
  document.title = L('Red vs Blue CTF · Döntések', 'Red vs Blue CTF · Decisions');
  if (VIEW === 'play' && !DATA.run) VIEW = 'home';
  let body;
  if (VIEW === 'play') body = DATA.run.end && !DATA.run.show ? endHTML(animate) : playHTML(animate);
  else body = homeHTML();
  app.innerHTML = topHTML() + body;
  if (VIEW === 'play') {
    if (DATA.run.end && !DATA.run.show) { if (animate && !RM()) countUp(); }
    else if (DATA.run.show) { if (animate) animateResult(); }
    else if (animate && !RM()) reveal(GEN); else startTimer(GEN);
  }
}
// Messages arrive one by one (typing dots first), then the situation and the options.
async function reveal(gen) {
  const scene = document.getElementById('scene'); if (!scene) return;
  const alive = () => gen === GEN;
  const show = el => el && el.classList.add('in');
  show(scene.querySelector('.shead')); await sleep(250); if (!alive()) return;
  for (const m of scene.querySelectorAll('.msg')) {
    const dots = document.createElement('div'); dots.className = 'typing'; dots.innerHTML = '<i></i><i></i><i></i>'; dots.setAttribute('aria-hidden', 'true');
    m.before(dots); await sleep(650); if (!alive()) return; dots.remove(); show(m); await sleep(550); if (!alive()) return;
  }
  show(scene.querySelector('.sit')); await sleep(400); if (!alive()) return;
  show(scene.querySelector('.timer'));
  for (const b of scene.querySelectorAll('.choice')) { show(b); await sleep(110); if (!alive()) return; }
  finishReveal(gen);
}
function finishReveal(gen) {
  const scene = document.getElementById('scene'); if (!scene) return;
  scene.querySelectorAll('.typing').forEach(d => d.remove());
  scene.querySelectorAll('.rv').forEach(el => { el.classList.remove('rv'); });
  const sk = scene.querySelector('.skip'); if (sk) sk.remove();
  const first = scene.querySelector('.choice'); if (first && !first.disabled) first.focus({ preventScroll: true });
  startTimer(gen);
}
function startTimer(gen) {
  const run = DATA.run; if (!run || run.show || run.end) return;
  const node = caseOf(run.cid).nodes[run.node];
  if (!TIMED || !node.urgent) return;
  let left = node.urgent * 1000; const total = left; let last = Date.now();
  const bar = document.getElementById('tbar'), sec = document.getElementById('tsec'), box = document.getElementById('timer');
  TIMER = setInterval(() => {
    if (gen !== GEN) return stopTimer();
    const now = Date.now(); if (!document.hidden) left -= now - last; last = now;
    if (bar) bar.style.width = Math.max(0, left / total * 100) + '%';
    if (sec) sec.textContent = Math.max(0, Math.ceil(left / 1000)) + ' s';
    if (box) box.classList.toggle('hurry', left < 10000);
    if (left <= 0) { stopTimer(); pick(node.timeout, true); }
  }, 100);
}
function countTo(el, from, to, ms = 900) {
  if (!el) return;
  if (RM()) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function countUp() { document.querySelectorAll('[data-count]').forEach((el, i) => setTimeout(() => countTo(el, 0, +el.dataset.count, 1100), 500 + i * 180)); }
// After a choice: meters slide to their new value, the clock rolls, the score counts up.
function animateResult() {
  const run = DATA.run, c = caseOf(run.cid), h = run.hist[run.hist.length - 1], before = prevRun(run), gen = GEN;
  setTimeout(() => {
    if (gen !== GEN || !document.getElementById('trail')) return;
    for (const k of E.METERS) {
      const el = document.querySelector(`.meter[data-k="${k}"]`); if (!el) continue;
      el.querySelector('.needle').style.transform = `rotate(${ang(run.m[k])}deg)`;
      el.setAttribute('aria-valuenow', run.m[k]);
      el.classList.toggle('low', run.m[k] <= 25);
      if (h.d[k]) { el.classList.add(h.d[k] > 0 ? 'up' : 'down'); countTo(el.querySelector('.mv'), before.m[k], run.m[k], 1300); }
    }
    countTo(document.getElementById('sc'), before.pts, run.pts);
    const ck = clockOf(c, run.t), hm = document.getElementById('hm');
    if (hm && run.t !== before.t) {
      hm.textContent = ck.hm; hm.classList.remove('tick'); void hm.offsetWidth; hm.classList.add('tick');
      document.getElementById('day').textContent = L(...ck.day);
      document.getElementById('el').textContent = elapsedText(run.t);
      const dt = document.getElementById('dt'); dt.textContent = '+' + durText(run.t - before.t); dt.classList.add('show');
    }
    document.getElementById('trail').innerHTML = trailHTML(c, run, null);
  }, RM() ? 0 : 350);
  const nx = document.getElementById('next'); if (nx) nx.focus({ preventScroll: true });
  const res = document.getElementById('result'); if (res && !RM()) res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ---------------------------------------------------------------- actions
function startCase(cid) {
  const c = caseOf(cid);
  DATA.run = E.newRun(c); DATA.run.timed = TIMED; DATA.run.startedAt = new Date().toISOString();
  const st = stats(cid); st.plays++; DATA.stats[cid] = st;
  save(); VIEW = 'play'; render(true); window.scrollTo(0, 0);
}
function pick(i, timedOut = false) {
  const run = DATA.run; if (!run || run.show || run.end) return;
  const c = caseOf(run.cid);
  stopTimer();
  // Lock the options in place and stamp the chosen one before the consequence appears.
  const scene = document.getElementById('scene');
  if (scene) {
    finishRevealSilently(scene);
    scene.querySelectorAll('.choice').forEach(b => { b.disabled = true; b.classList.add(+b.dataset.i === i ? 'picked' : 'dim'); });
    const t = scene.querySelector('.timer'); if (t) t.remove();
  }
  const ord = shownOrder(run, run.node);
  DATA.run = E.choose(c, run, i, timedOut);
  DATA.run.hist[DATA.run.hist.length - 1].ord = ord;
  if (DATA.run.end) {
    const st = stats(c.id), sc = E.finalScore(c, DATA.run, FAIL);
    if (!st.ends.includes(DATA.run.end)) st.ends.push(DATA.run.end);
    st.best = Math.max(st.best, sc.total); DATA.stats[c.id] = st;
    DATA.unsaved = { row: resultRow(c, DATA.run), user: USER ? USER.username : null, status: null };
    DATA.lastSaved = null;
    if (USER) setTimeout(() => saveResult(false), 0);
  }
  save();
  setTimeout(() => render(true), RM() ? 0 : 380);
}
function finishRevealSilently(scene) {
  GEN++;
  scene.querySelectorAll('.typing,.skip').forEach(d => d.remove());
  scene.querySelectorAll('.rv').forEach(el => el.classList.remove('rv'));
}
async function next() {
  const run = DATA.run; if (!run || !run.show) return;
  run.show = null; save();
  const scene = document.getElementById('scene');
  if (scene && !RM()) { scene.classList.add('leave'); await sleep(280); }
  render(true); window.scrollTo({ top: 0, behavior: RM() ? 'auto' : 'smooth' });
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'lang') { LANG = LANG === 'en' ? 'hu' : 'en'; try { localStorage.setItem('rvb-lang', LANG); } catch (e) { } render(false); }
  else if (a === 'theme') { DARK = !DARK; document.documentElement.dataset.theme = DARK ? 'dark' : ''; try { localStorage.setItem('rvb-theme', DARK ? 'dark' : 'light'); } catch (e) { } render(false); }
  else if (a === 'home') { VIEW = 'home'; if (DATA.run && DATA.run.end && !DATA.run.show) { DATA.run = null; save(); } render(true); }
  else if (a === 'timed') { TIMED = !TIMED; store.set('rvb-dontes-timer', TIMED); b.setAttribute('aria-checked', TIMED); }
  else if (a === 'start') startCase(b.dataset.c);
  else if (a === 'resume') { VIEW = 'play'; render(true); }
  else if (a === 'abandon') { DATA.run = null; save(); VIEW = 'home'; render(true); }
  else if (a === 'choose') pick(+b.dataset.i);
  else if (a === 'next') next();
  else if (a === 'skip') finishReveal(++GEN);
  else if (a === 'saveres') saveResult(true);
});
document.addEventListener('keydown', ev => {
  if (VIEW !== 'play' || !DATA.run || DATA.run.show || DATA.run.end || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toUpperCase(), i = 'ABCD'.indexOf(k) >= 0 ? 'ABCD'.indexOf(k) : '1234'.indexOf(k);
  const order = shownOrder(DATA.run, DATA.run.node);
  if (i >= 0 && i < order.length && !document.querySelector('.choice.rv:not(.in)')) { ev.preventDefault(); pick(order[i]); }
});
// A saved game from an older or changed case file is dropped rather than crashing.
try { if (DATA.run) { const c = caseOf(DATA.run.cid); if (!c || (DATA.run.node && !c.nodes[DATA.run.node])) throw 0; } } catch (e) { DATA.run = null; VIEW = 'home'; save(); }
render(true);
whoAmI().then(u => { USER = u; if (u) { if (DATA.unsaved && DATA.unsaved.user === u.username && DATA.unsaved.status !== 'saving') saveResult(false); if (VIEW === 'home' || !DATA.run || (DATA.run.end && !DATA.run.show)) render(false); } });
</script>
</body>
