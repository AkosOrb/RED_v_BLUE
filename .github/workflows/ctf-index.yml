name: CTF feladatbank ellenőrzése

on:
  push:
    paths: ['ctf/**']
  pull_request:
    paths: ['ctf/**']

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Feladatok ellenőrzése és index.json generálása
        run: python3 ctf/tools/build_index.py
      - name: index.json visszaírása (csak push esetén)
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet ctf/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add ctf/index.json
            git commit -m "CTF index.json frissítése"
            git push
          fi
