<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red vs Blue</title>
<meta name="description" content="Red vs Blue: kiberbiztonsági stratégiai kártyajáték. A Red végig akar jutni a támadási lánc öt szakaszán, a Blue észlelni és megállítani akarja. Minden lap egy valós támadás vagy védekezés.">
<meta property="og:title" content="Red vs Blue – kiberbiztonsági kártyajáték">
<meta property="og:description" content="Támadók és védők a támadási lánc öt szakaszán, valós esetekkel. Helyi, online és szerepkörös játék, valamint CTF mód.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=Saira+Stencil+One&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: industrial label look (charcoal, warm beige, signal orange) on grid paper.
   Board column (attack chain as a circuit trace) beside the play column. */
:root{
  --ground:#ECE8E2; --paper:#D6CEC3; --ink:#232323; --ink2:#3a3a3a; --mute:#6b655e; --char:#3e3e3e;
  --red:#FF3B12; --blue:#2F86DA; --white:#F6F3EE; --soft:#D9D2C8; --ok:#2f8f4e;
  --btn-bg:#3e3e3e; --btn-bg2:#525252; --btn-fg:#F6F3EE; --btn-on-bg:#FF3B12; --btn-on-fg:#1a1a1a;
  --f-disp:'Archivo','Helvetica Neue','Arial Black',sans-serif; --f-body:'Archivo','Helvetica Neue',system-ui,sans-serif; --f-mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  --f-num:'Saira Stencil One','Archivo',sans-serif;
  --stripes:repeating-linear-gradient(-55deg,var(--red) 0 7px,transparent 7px 13px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;margin:0;
  background-image:linear-gradient(rgba(35,35,35,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(35,35,35,.06) 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:var(--ink);cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* clip-path cuts off anything outside the box, so chamfered controls draw the ring inside instead */
.btn:focus-visible,.seg button:focus-visible,.choice:focus-visible{outline:3px solid var(--white);outline-offset:-6px}
.hc:focus-visible{outline:3px solid var(--ink);outline-offset:-6px}
.cats button:focus-visible{outline:3px solid var(--white);outline-offset:-6px}
.top :focus-visible{outline-color:var(--white)}
.mono{font-family:var(--f-mono);letter-spacing:.14em}
.disp{font-family:var(--f-disp);font-weight:900;letter-spacing:-.01em}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
.cut{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.frame{background:var(--ink);padding:2px}
.frame>.fi{background:var(--paper);padding:12px 14px;height:100%;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.panel{background:var(--char);color:var(--soft);padding:14px 16px}
.panel h3{color:var(--white)}
textarea.sdp{display:block;width:100%;min-width:0;font-family:var(--f-mono);font-size:12px;line-height:1.35;word-break:break-all;padding:8px 10px;border:2px solid var(--ink);background:var(--white);color:var(--ink);resize:vertical;margin:6px 0 8px}
.p2p h2{color:var(--white);font-size:17px;margin:12px 0 2px}.p2p .hint{color:var(--soft)}.p2p .warn{color:#FFA13D;font-weight:700}

.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-disp);font-weight:900;font-size:21px;letter-spacing:-.005em;text-transform:uppercase}
h3{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.r{color:var(--red)}.b{color:var(--blue)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;padding:2px 7px;background:var(--ink);color:var(--white);white-space:nowrap}
.tag.tr{background:var(--red);color:var(--ink)}.tag.tb{background:var(--blue);color:var(--ink)}.tag.tg{background:var(--ground);color:var(--ink);border:1.5px solid var(--ink)}
.btn{border:0;background:var(--btn-bg);color:var(--btn-fg);padding:10px 16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:13px;-webkit-text-fill-color:var(--btn-fg);opacity:1;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:hover{background:var(--btn-bg2)}
.btn.red{box-shadow:inset 6px 0 0 var(--red)}.btn.blue{box-shadow:inset 6px 0 0 var(--blue)}
.btn.ghost{box-shadow:inset 0 0 0 2px var(--btn-fg)}
.btn:active,.btn[aria-pressed=true],.seg button[aria-pressed=true],.seg button:active{background:var(--btn-on-bg);color:var(--btn-on-fg);-webkit-text-fill-color:var(--btn-on-fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top .btn.abort,.btn.abort{background:var(--btn-on-bg);color:var(--btn-on-fg);-webkit-text-fill-color:var(--btn-on-fg)}
.top .btn.abort:hover,.btn.abort:hover{background:#FF6A47}
.top .btn.abort:active,.btn.abort:active,.top .btn.abort[aria-expanded=true]{background:var(--btn-bg);color:var(--btn-fg);-webkit-text-fill-color:var(--btn-fg)}
.abortbar{background:var(--btn-bg);color:var(--white);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:4px solid var(--btn-on-bg)}
.btn.hostred{background:var(--btn-on-bg);color:var(--btn-on-fg);-webkit-text-fill-color:var(--btn-on-fg);box-shadow:inset 6px 0 0 var(--red)}
.btn.hostred:hover{background:#FF6A47}
.btn.hostred:active{background:var(--btn-bg);color:var(--btn-fg);-webkit-text-fill-color:var(--btn-fg)}
.btn[aria-pressed=true][disabled],.seg button[aria-pressed=true][disabled]{opacity:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
/* top bar */
.top{background:var(--char);color:var(--white);display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:-.02em}
.logo small{font-size:11px;vertical-align:middle;margin:0 4px;color:var(--soft)}
.top .sp{flex:1}
.top .btn{clip-path:none;padding:6px 10px;font-size:11px;background:#555}
.top .btn:hover{background:#666}
.top .lang{display:inline-flex;gap:2px}.top .lang .btn{min-width:34px}
.pill{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;padding:3px 8px;border:1.5px solid var(--soft)}
.accent{height:8px;display:flex;background:var(--char)}.accent i{flex:1}.accent i:nth-child(1){background:var(--stripes);max-width:180px}.accent i:nth-child(2){background:linear-gradient(var(--char) 0 3px,var(--red) 3px 5px,var(--char) 5px)}
/* menu */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;margin-top:18px}
.hero .big{font-family:var(--f-disp);font-weight:900;font-size:clamp(64px,11vw,132px);line-height:.84;letter-spacing:-.045em}
.hero .big span.vs{font-family:var(--f-num);font-weight:400;font-size:.3em;vertical-align:middle;color:var(--ink);letter-spacing:0}
.choices{display:grid;gap:12px}
.choice{display:block;text-align:left;width:100%;border:0;padding:2px;background:var(--ink);color:var(--ink)}
.choice .fi{padding:14px 16px;background:var(--paper);color:var(--ink);clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.choice b{display:block;font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:-.005em}
.choice .hint{color:inherit}
button.choice,a.choice{background:var(--btn-bg)}
button.choice .fi,a.choice .fi{background:var(--btn-bg);color:var(--btn-fg);-webkit-text-fill-color:var(--btn-fg)}
button.choice:hover .fi,a.choice:hover .fi{background:var(--btn-bg2)}
button.choice .fi,a.choice .fi{box-shadow:inset 6px 0 0 var(--red)}
button.choice:active .fi,a.choice:active .fi{background:var(--btn-on-bg);color:var(--btn-on-fg);-webkit-text-fill-color:var(--btn-on-fg)}
.choice .go{display:table;margin-top:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px;border-bottom:2px solid currentColor}
.choice h3{font-size:18px;font-weight:900;letter-spacing:-.005em}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cats button{flex:1 1 110px;border:0;text-align:left;background:var(--char);color:var(--white);padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 -3px 0 var(--mute)}
.cats button:hover{box-shadow:inset 0 -3px 0 var(--red)}
.cats button[aria-expanded=true]{box-shadow:inset 0 -5px 0 var(--red)}
.cats svg{width:26px;height:26px}
.catinfo{background:var(--char);color:var(--soft);padding:10px 12px;margin-top:6px;font-size:14px}
.catinfo b{color:var(--white)}
@media (max-width:600px){.cats button{flex:1 1 0;min-width:0;padding:8px 4px;align-items:center;gap:4px}.cats b{display:none}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* 09: comfortable touch targets on touch screens */
@media (pointer:coarse){.btn,.seg button{min-height:44px}.top .btn{min-height:40px;min-width:44px}}
input[type=text]{font-family:var(--f-mono);font-size:18px;letter-spacing:.2em;text-transform:uppercase;padding:9px 10px;border:2px solid var(--ink);background:#FBFAF7;color:var(--ink);width:100%;min-width:0}
/* setup */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:0;background:var(--btn-bg);color:var(--btn-fg);-webkit-text-fill-color:var(--btn-fg);padding:10px 0;font-family:var(--f-disp);font-weight:900;letter-spacing:.02em}
.seg button:hover{background:var(--btn-bg2)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}

.rolechk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--mute)}
.rolechk input{margin-top:4px;width:18px;height:18px;accent-color:var(--ink)}
.rolechk small{display:block;color:var(--ink2)}
/* game grid */
.game{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}.game>.stack:last-child{order:-1}.hero{grid-template-columns:minmax(0,1fr)}}
/* board */
.board{background:var(--ink);padding:2px}
.board .fi{background:var(--paper);padding:10px}
.zone{display:grid;grid-template-columns:minmax(0,1fr) 52px 64px;gap:8px;align-items:center;margin-bottom:8px;position:relative}
/* trace: a vertical line through the pawn slots, orange where Red has already passed */
.zone::before{content:'';position:absolute;z-index:0;left:calc(100% - 64px - 8px - 28px);width:4px;top:-8px;bottom:0;background:var(--ink)}
.zone:first-of-type::before{top:50%}.zone.cur::before{bottom:50%}.zone.cur~.zone::before{background:var(--mute);width:2px;margin-left:1px}
.zone.past::before,.zone.cur::before{background:var(--red)}
.zone:last-of-type::before{bottom:50%}
.zplate{background:var(--char);color:var(--white);padding:8px 10px;display:flex;gap:8px;align-items:center;min-width:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.zplate svg{width:22px;height:22px;flex:none}
.zplate .zn{font-size:13.5px;font-weight:900;text-transform:uppercase;line-height:1.1}
.zplate .ze{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:#FF7A55;text-transform:uppercase}
.zone.cur .zplate{background:var(--red);color:var(--ink)}.zone.cur .zplate .ze{color:var(--ink)}
.pawnslot{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.zone.past .pawnslot{border-color:var(--red)}
.pawnslot:empty::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--ink)}.zone.past .pawnslot:empty::after{background:var(--red)}
.pawn{width:44px;height:44px;border-radius:50%;background:var(--red);border:3px solid var(--ink);color:var(--ink);font-family:var(--f-disp);font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.det{height:52px;border:2px dashed var(--blue);background:rgba(47,134,218,.1);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:26px;color:var(--blue)}
.det.on{background:var(--blue);border-style:solid;border-color:var(--ink);color:var(--ink)}
.ctrlrow{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;margin-top:-4px}
.ctrlrow span{position:relative;z-index:1;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;background:var(--blue);color:var(--ink);padding:1px 6px}
.track{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:6px}
.track div{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center}
.track div{border:2px solid var(--ink);text-align:center;font-family:var(--f-num);font-size:13px;padding:0}
.track div.done{background:var(--ink);color:var(--paper)}
.track div.now{background:var(--red);color:var(--ink);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--red)}
.track div.last{color:var(--blue);border-color:var(--blue);border-width:3px}
.track div.last.now{color:var(--blue)}
/* phase */
.phase{display:flex;gap:12px;align-items:center;background:var(--char);color:var(--white);padding:12px 14px;flex-wrap:wrap}
.phase .who{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:-.01em}
.phase .steps{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
@media (max-width:600px){.phase .steps{margin-left:0}.top{gap:8px 10px;padding:8px 12px}.top .sp{flex-basis:100%;height:0}.wrap{padding-inline:12px}h2{font-size:18px}.code{font-size:26px;letter-spacing:.14em}}
.phase .steps span{font-family:var(--f-mono);font-size:10px;padding:4px 14px 4px 12px;background:#4c4c4c;color:#a9a39b;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%)}
.phase .steps span:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%)}
.phase .steps span.on{color:var(--ink);background:var(--red)}
.hint{font-size:14px;color:var(--ink2)}
/* cards */
.hand{display:flex;gap:10px;flex-wrap:wrap}
.hc{color:var(--ink);position:relative;width:148px;min-height:206px;background:var(--ink);padding:2px;border:0;text-align:left;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:transform .15s}
.hc .ci{background:var(--paper);height:100%;min-height:202px;padding:8px 9px;display:flex;flex-direction:column;gap:6px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.hc .bar{height:8px;margin:-8px -9px 2px;}
.hc.sr .bar{background:repeating-linear-gradient(-55deg,var(--red) 0 7px,var(--paper) 7px 11px)}.hc.sb .bar{background:repeating-linear-gradient(-55deg,var(--blue) 0 7px,var(--paper) 7px 11px)}
.hc .top2{display:flex;gap:6px;align-items:center}
.hc .str{font-family:var(--f-num);font-size:38px;line-height:1}
.hc .cat{background:var(--char);color:var(--white);display:flex;align-items:center;gap:5px;padding:4px 6px;flex:1;min-width:0}
.hc .cat svg{width:16px;height:16px;flex:none}
.hc .cat span{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .tt{background:var(--char);color:var(--white);font-weight:800;font-size:12px;line-height:1.15;overflow-wrap:anywhere;hyphens:auto;text-transform:uppercase;padding:6px 7px;flex:1}
.hc .en{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.04em;text-transform:none;font-weight:400;margin-top:4px}
.hc.sr .en{color:#FF8A66}.hc.sb .en{color:#7DB8F0}
.hc .tags{display:flex;gap:4px;min-height:18px}
.hc.playable{cursor:pointer}
.hc.dim{opacity:.55}
.hc.sel{transform:translateY(-8px)}
.hc.sel{background:var(--red)}.hc.sb.sel{background:var(--blue)}
.hc.sel .ci{box-shadow:inset 0 0 0 3px var(--ink)}
.back{width:148px;height:206px;background:var(--char);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--white);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.back .disp{font-size:22px}
.back.sr,.back.sb{background-image:repeating-linear-gradient(-55deg,transparent 0 14px,rgba(255,255,255,.05) 14px 16px)}
.back.sr{box-shadow:inset 0 0 0 6px var(--red)}.back.sb{box-shadow:inset 0 0 0 6px var(--blue)}
.back.small{width:46px;height:64px}.back.small .disp{font-size:9px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:600px){.detail{grid-template-columns:minmax(0,1fr)}.hc{width:calc(50% - 5px)}.back{width:calc(50% - 5px)}}
.case{border:2px solid var(--ink);border-left-width:6px;padding:8px 10px;font-size:13px;background:rgba(246,243,238,.5)}
/* clash */
.clash{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.clash .side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.clash .sum{font-family:var(--f-num);font-size:34px}
.clash .vs{font-family:var(--f-num);font-size:26px}
@media (max-width:600px){.clash{gap:6px}.clash .hc,.clash .back{width:100%;max-width:148px}.clash .ci{min-width:0}.clash .top2{min-width:0;overflow:hidden}.clash .sum{font-size:22px}}
.result{font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;text-align:center}
.result.rw{background:var(--red);color:var(--ink)}.result.bw{background:var(--blue);color:var(--ink)}.result.tw{background:var(--char);color:var(--white)}
/* crypto */
.kcard{background:var(--char);color:var(--white);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.kcard.nom{grid-template-columns:minmax(0,1fr)}
.morse{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 10px;border-right:2px dashed #77716a}
.morse i{display:block;width:12px;background:var(--white)}
.morse i.dot{height:12px;border-radius:50%}.morse i.dash{height:34px;border-radius:3px}
.morse hr{width:30px;border:0;border-top:2px dashed #77716a;margin:6px 0}
.frag{border:2px solid #77716a;padding:8px 10px;margin-top:10px;background-image:radial-gradient(rgba(163,163,163,.22) 1.2px,transparent 1.6px);background-size:14px 14px}
.frag .cx{font-family:var(--f-mono);font-size:clamp(17px,3vw,26px);letter-spacing:.22em;text-align:center;padding:6px 0;overflow-wrap:anywhere}
.duelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.timer{height:10px;background:var(--char);position:relative;overflow:hidden}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .5s linear}
.ans label{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;margin:8px 0 3px}
details.ref{margin-top:4px}
details.ref summary{cursor:pointer;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.reftbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:8px;font-size:13px}
.pb{border-collapse:collapse}.pb td,.pb th{border:1.5px solid var(--ink);width:30px;height:28px;text-align:center;font-family:var(--f-disp);font-size:12px}
.pb th{background:var(--ink);color:var(--white)}
.mrow{display:flex;gap:8px;align-items:center;font-family:var(--f-mono)}
.mrow i{display:inline-block;height:6px;background:var(--ink);margin-right:3px;border-radius:3px}
/* log */

  let t = (st.sd = (st.sd + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);

// one row per finished clash for the end-of-game summary: [round, stage, red card, blue card, red total, blue total, result, duel level, duel ms]
function summ(st) { const c = st.cl; (st.sm = st.sm || []).push([st.rd, c.z, c.r, c.b, c.rt, c.bt, c.w, c.lv || 0, c.dt == null ? -1 : c.dt]); }

// Game modes: 0 = base game, 1 = Haladó (budget, slow draw, reward choice), 2 = Profi (+ staging, noise, missions, crown jewel, priced roles)
const GM_NAMES = [['ALAPJÁTÉK', 'BASE GAME'], ['HALADÓ', 'ADVANCED'], ['PROFI', 'PRO']];
const INCOME = { r: 4, b: 3 }, RES_CAP = 10, HAND_MAX = 7, NOISE_MAX = 4;
const MISSIONS = ['ransom', 'esp', 'wiper', 'se'];
const adv = st => (st.gm | 0) >= 1, pro = st => (st.gm | 0) >= 2;
const costOf = (st, ch) => (adv(st) ? cardOf(ch).p : 0);
const ctrlCost = (st, ch) => (adv(st) ? Math.max(0, cardOf(ch).p - 2) : 0);
const hasPers = (st, z) => adv(st) && st.ps[z - 1] === '1';

function newGame(seed, gm) {
  return {
    v: 1, ph: 'setup', sq: 0, sd: seed >>> 0, gm: Math.max(0, Math.min(2, gm | 0)),
    cfg: { r: { n: 3, ro: [1, 1, 1, 1, 1], ok: 0 }, b: { n: 3, ro: [1, 1, 1, 1, 1], ok: 0 }, alt: 0 },
    rd: 0, z: 1, det: 0, dk: { r: '', b: '' }, h: { r: '', b: '' }, ds: { r: '', b: '' },
    ct: ['', '', '', '', ''], u: { lead: 0, recon: 0, ciso: 0, ir: 0 }, ov: 0, rp: 0, pkr: 0, pk: '',
    pl: { r: '', b: '' }, cl: null, du: null, cr: ['', '', '', '', ''], fc: 0, hist: '', w: '', wr: '', lg: [], fl: [], sm: [],
    // modes: rs budget, ps persistence flags per stage, rw reward chooser, ik threat-intel cards, tr trimming side,
    // sg staged card per stage, sgd staged this round, pls attack came from staging, hu hunted this round,
    // nz noise, ms mission index, mp mission progress, ep espionage streak, cj crown jewel stage, cjr revealed, pkc Red saw crown
    rs: { r: 0, b: 0 }, ps: '00000', rw: '', ik: '', tr: '', sg: ['', '', '', '', ''], sgd: 0, pls: 0, hu: 0,
    nz: 0, ms: -1, mp: 0, ep: 0, cj: 0, cjr: 0, pkc: 0
  };
}

function cfgError(st, side, c) {
  const k = c.ro.reduce((a, b) => a + (b ? 1 : 0), 0);
  if (c.n === 2 && k !== 3) return 'A 2 fős csapat pontosan 3 szerepkört választ.';
  if (c.n >= 3 && k !== 5) return 'Legalább 3 fő esetén mind az 5 szerepkör játékban van.';
  if (st.cfg.alt && side === 'b' && c.n === 2 && c.ro[1] && c.ro[2]) return 'Alternatív mód: a 2 fős Blue nem választhatja egyszerre a SOC elemzőt és az Incidenskezelőt.';
  return '';
}

function draw(st, side, n) {
  for (let i = 0; i < n; i++) {
    if (!st.dk[side].length) {
      if (!st.ds[side].length) return;
      st.dk[side] = shuffle(st, st.ds[side]); st.ds[side] = '';
      log(st, ['shuf', side]);
    }
    st.h[side] += st.dk[side][0]; st.dk[side] = st.dk[side].slice(1);
  }
}
function refill(st, side) { draw(st, side, Math.max(0, 5 - st.h[side].length)); }
const hasCat = (st, side, z) => st.h[side].split('').some(ch => cardOf(ch).c === z);
// cards Red can attack with right now (in hand and affordable, or staged at this stage)
const canAttack = st => st.h.r.split('').some(ch => cardOf(ch).c === st.z && costOf(st, ch) <= st.rs.r) || (pro(st) && !!st.sg[st.z - 1]);

function startGame(st) {
  let r = '', b = '';
  for (let i = 0; i < 25; i++) { r += enc(i); b += enc(25 + i); }
  st.dk.r = shuffle(st, r); st.dk.b = shuffle(st, b);
  for (let l = 1; l <= 5; l++) {
    let s = ''; DATA.crypto.forEach((c, i) => { if (c.l === l) s += enc(i); });
    st.cr[l - 1] = shuffle(st, s);
  }
  st.rd = 0; st.z = 1; log(st, ['start']);
  if (adv(st)) {
    st.rs = { r: pro(st) ? 4 : 2, b: 2 };
    draw(st, 'r', 5); draw(st, 'b', 5);
  }
  if (pro(st)) { st.ms = Math.floor(rnd(st) * 4); st.ph = 'cj'; return; }
  beginRound(st);
}
function beginRound(st) {
  st.rd++; st.ov = 0; st.fc = 0; st.rp = 0; st.pkr = 0; st.pk = ''; st.pl = { r: '', b: '' }; st.du = null;
  st.ik = ''; st.sgd = 0; st.pls = 0; st.hu = 0;
  if (adv(st)) {
    ['r', 'b'].forEach(s => { st.rs[s] = Math.min(RES_CAP, st.rs[s] + INCOME[s]); draw(st, s, 2); });
  } else { refill(st, 'r'); refill(st, 'b'); }
  st.ph = 'atk'; log(st, ['rd', st.rd]);
}

function ctrlBonus(st, z) { return st.ct[z - 1].length; }
function totals(st) {
  const rc = cardOf(st.pl.r), z = st.z;
  const rb = (has(st, 'r', 'exploit') && z === 2 ? 1 : 0) + (has(st, 'r', 'social') && rc.se ? 1 : 0)
    + (hasPers(st, z) ? 1 : 0) + (st.pls ? 1 : 0) + (pro(st) && st.ms === 0 && z === 5 ? 2 : 0);
  if (st.pl.b === '-') return { rt: rc.p + rb, rb, bt: 0, bb: 0 };
  const bc = cardOf(st.pl.b);
  const bb = (has(st, 'b', 'admin') && z === 3 ? 1 : 0) + ctrlBonus(st, z) + (pro(st) && st.cj === z ? 1 : 0);
  return { rt: rc.p + rb, rb, bt: bc.p + bb, bb };
}
function discardClash(st) {
  st.ds.r += st.pl.r; st.hist += st.pl.r;
  if (st.pl.b && st.pl.b !== '-') { st.ds.b += st.pl.b; st.hist += st.pl.b; }
  st.pl = { r: '', b: '' };
}
function finish(st, w, why) { st.w = w; st.wr = why; st.ph = 'end'; log(st, ['end', w, why]); }

function resolve(st) {
  const t = totals(st);
  st.cl = { r: st.pl.r, b: st.pl.b, z: st.z, rt: t.rt, bt: t.bt, rb: t.rb, bb: t.bb, w: '' };
  log(st, ['clash', st.pl.r, st.pl.b, t.rt, t.bt]);
  if (adv(st)) { // costs are paid at reveal, so the face-down strength stays secret until now
    if (!st.pls) st.rs.r -= costOf(st, st.pl.r);
    if (st.pl.b !== '-') st.rs.b -= costOf(st, st.pl.b);
  }
  if (pro(st)) {
    if (st.cj === st.z && st.pl.b !== '-' && !st.cjr) { st.cjr = 1; log(st, ['cjr', st.z]); }
    if (cardOf(st.pl.r).p >= 4 && ++st.nz >= NOISE_MAX) {
      st.nz = 0; st.det = Math.min(5, st.det + 1); log(st, ['noise', st.det]);
      if (st.det >= 5) { st.cl.w = 'n'; summ(st); discardClash(st); return finish(st, 'b', 'b5'); }
    }
  }
  if (st.pl.b === '-' || t.rt > t.bt) return redWins(st);
  if (t.bt > t.rt) return blueWins(st, t.bt - t.rt);
  // tie -> crypto duel
  const lv = Math.min(5, Math.max(1, t.rt));
  if (!st.cr[lv - 1].length) { let s = ''; DATA.crypto.forEach((c, i) => { if (c.l === lv) s += enc(i); }); st.cr[lv - 1] = shuffle(st, s); }
  const c = st.cr[lv - 1][0]; st.cr[lv - 1] = st.cr[lv - 1].slice(1);

}
function redWins(st) {

}
function after(st) {

// end of round: espionage check, round limit, hand limit, then the next round
function endRound(st) {

}
function nextTrim(st) {

    if (s) { st.ph = 'trim'; st.tr = s; return; }

const norm = x => x.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/J/g, 'I').replace(/[^A-Z]/g, '');
function fnv(x) { let h = 2166136261; for (let i = 0; i < x.length; i++) { h ^= x.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function checkAnswer(c, ans) { return c.f.every((f, i) => fnv(norm(ans[i] || '')) === f.h); }

// returns error string, or '' after mutating st
function apply(st, side, a) {
  if (st.ph === 'end') return 'A játék véget ért.';
  if (a.t === 'abort') { finish(st, '', 'abort:' + side); return ''; }
  if (st.ph === 'setup') {
    if (a.t === 'cfg') {
      const c = { n: Math.max(2, Math.min(5, a.n | 0)), ro: a.ro.map(x => (x ? 1 : 0)), ok: 0 };
      if (c.n >= 3) c.ro = [1, 1, 1, 1, 1];
      else if (c.ro.reduce((x, y) => x + y, 0) === 5) c.ro = [1, 1, 1, 0, 0];
      st.cfg[side] = c; return '';
    }
    if (a.t === 'alt') { st.cfg.alt = a.v ? 1 : 0; st.cfg.r.ok = st.cfg.b.ok = 0; return ''; }
    if (a.t === 'ready') {
      const e = cfgError(st, side, st.cfg[side]); if (e) return e;
      st.cfg[side].ok = 1;
      if (st.cfg.r.ok && st.cfg.b.ok) startGame(st);
      return '';
    }
    return 'Most a beállítás jön.';
  }
  if (st.ph === 'cj') {
    if (side !== 'b') return 'Most a Blue választ koronaékszert.';
    if (a.t !== 'cj' || !(a.z >= 1 && a.z <= 5)) return 'Válassz egy szakaszt (01–05).';
    st.cj = a.z | 0; log(st, ['cj']); beginRound(st); return '';
  }
  if (st.ph === 'atk') {
    if (side !== 'r') return 'Most a Red támad.';
    if (st.pl.r) return 'Már kijátszottál lapot.';
    if (a.t === 'peek' || a.t === 'peekcj') {
      if (pro(st)) {
        if (!has(st, 'r', 'recon') || st.pkr) return 'A Felderítő most nem használható.';
        if (st.rs.r < 2) return 'Nincs elég Erőforrásod (2).';
      } else if (!has(st, 'r', 'recon') || st.u.recon >= 2 || st.pkr) return 'A Felderítő most nem használható.';
      if (a.t === 'peekcj') {
        if (!pro(st)) return 'A Felderítő most nem használható.';
        st.pkc = 1; st.pkr = 1; st.rs.r -= 2; log(st, ['peekcj']); return '';
      }
      if (!st.h.b.length) return 'A Blue keze üres.';
      st.pk = st.h.b[Math.floor(rnd(st) * st.h.b.length)]; st.pkr = 1;
      if (pro(st)) st.rs.r -= 2; else st.u.recon++;
      log(st, ['peek']); return '';
    }
    if (a.t === 'ov') {
      if (!has(st, 'r', 'lead') || st.u.lead || st.ov) return 'Az Operációvezető most nem használható.';
      st.u.lead = 1; st.ov = 1; log(st, ['ov']); return '';
    }
    if (a.t === 'play') {
      if (a.sg) {
        if (!pro(st) || !st.sg[st.z - 1] || st.sg[st.z - 1] !== a.c) return 'Itt nincs előkészített lapod.';
        st.sg[st.z - 1] = ''; st.pl.r = a.c; st.pls = 1; st.ph = 'def'; log(st, ['atks', st.z]); return '';
      }
      if (!st.h.r.includes(a.c)) return 'Ez a lap nincs a kezedben.';
      if (cardOf(a.c).c !== st.z) return 'Csak a bábu szakaszának kategóriájából támadhatsz.';
      if (costOf(st, a.c) > st.rs.r) return 'Nincs elég Erőforrásod ehhez a laphoz.';
      st.h.r = st.h.r.replace(a.c, ''); st.pl.r = a.c; st.ph = 'def'; log(st, ['atk', st.z]); return '';
    }
    if (a.t === 'replan') {
      if (hasCat(st, 'r', st.z) || (pro(st) && st.sg[st.z - 1])) return 'Van megfelelő lapod, újratervezni nem kell.';
      if (st.rp) return 'Ebben a támadásban már újraterveztél.';
      if (adv(st)) { if (st.rs.r < 1) return 'Nincs elég Erőforrásod (1).'; st.rs.r--; }
      const cs = (a.cs || []).filter((c, i, arr) => st.h.r.includes(c) && arr.indexOf(c) === i).slice(0, 3);

      if (!canAttack(st)) { log(st, ['noatk']); st.ov = st.ov ? 2 : 0; after(st); }

    }
    if (a.t === 'skip') {
      if (canAttack(st)) return 'Van megfelelő lapod.';
      log(st, ['noatk']); st.ov = st.ov ? 2 : 0; after(st); return '';
    }
    if (a.t === 'quiet') {
      if (!pro(st)) return 'Ismeretlen lépés.';
      st.nz = Math.max(0, st.nz - 2); log(st, ['quiet', st.nz]); st.ov = st.ov ? 2 : 0; after(st); return '';
    }
    return 'Ismeretlen lépés.';
  }
  if (st.ph === 'def') {
    if (side !== 'b') return 'Most a Blue védekezik.';
    if (a.t === 'def') {
      if (!st.h.b.includes(a.c)) return 'Ez a lap nincs a kezedben.';
      if (cardOf(a.c).c !== st.z) return 'Csak azonos kategóriájú lappal védekezhetsz.';
      if (costOf(st, a.c) > st.rs.b) return 'Nincs elég Erőforrásod ehhez a laphoz.';
      st.h.b = st.h.b.replace(a.c, ''); st.pl.b = a.c; resolve(st); return '';
    }
    if (a.t === 'pass') { st.pl.b = '-'; resolve(st); return ''; }

    if (a.t === 'ans') {
      if (d.out.includes(side)) return 'Hibás válasz után már nem fejthetsz.';
      if (checkAnswer(c, a.a || [])) {

    if (side === 'r') {

      if (a.t === 'pers') {
        if (hasPers(st, st.z)) return 'Ezen a szakaszon már van Perzisztencia-jelző.';
        st.ps = st.ps.slice(0, st.z - 1) + '1' + st.ps.slice(st.z); log(st, ['pers', st.z]); after(st); return '';
      }
      return 'Válassz: előrelépés vagy Perzisztencia.';
    }
    if (a.t === 'det') {
      st.det = Math.min(5, st.det + 1); log(st, ['bw', st.det, 0]);
      if (st.det >= 5) return finish(st, 'b', 'b5'), '';
      after(st); return '';
    }
    if (a.t === 'intel') {
      const h = st.h.r.split('');
      for (let i = h.length - 1; i > 0; i--) { const j = Math.floor(rnd(st) * (i + 1)); [h[i], h[j]] = [h[j], h[i]]; }
      st.ik = h.slice(0, 2).join(''); log(st, ['intel']); after(st); return '';
    }
    if (a.t === 'evict') {
      const z = a.z | 0;
      if (!(z >= 1 && z <= 5) || st.ps[z - 1] !== '1') return 'Ott nincs Perzisztencia-jelző.';
      st.ps = st.ps.slice(0, z - 1) + '0' + st.ps.slice(z); log(st, ['evict', z]); after(st); return '';
    }
    return 'Válassz: Észlelés, Fenyegetés-felderítés vagy Kiűzés.';
  }
  if (st.ph === 'fort') {
    if (side !== 'b') return 'Most a Blue erősít.';
    if (a.t === 'ctrl') {
      const card = st.h.b.includes(a.c) ? cardOf(a.c) : null;
      if (!card || !card.t) return 'Csak „Tartós” jelű lap rakható le kontrollként.';
      if (st.ct[card.c - 1].length >= 2) return 'Ebben a kategóriában már 2 kontroll van kint.';
      if (ctrlCost(st, a.c) > st.rs.b) return 'Nincs elég Erőforrásod ehhez a kontrollhoz.';
      if (st.fc >= 1) {
        if (pro(st) || !has(st, 'b', 'ciso') || st.u.ciso || st.fc >= 2) return 'Ebben a körben már raktál le kontrollt.';
        st.u.ciso = 1;
      }
      st.rs.b -= ctrlCost(st, a.c);
      st.h.b = st.h.b.replace(a.c, ''); st.ct[card.c - 1] += a.c; st.fc++; log(st, ['ctrl', a.c]); return '';
    }
    if (a.t === 'cisob') {
      if (!pro(st) || !has(st, 'b', 'ciso') || st.u.ciso) return 'A CISO most nem használható.';
      st.u.ciso = 1; st.rs.b = Math.min(RES_CAP, st.rs.b + 3); log(st, ['cisob']); return '';
    }
    if (a.t === 'ir') {
      if (!has(st, 'b', 'ir') || st.u.ir || st.z <= 1) return 'Az Incidenskezelő most nem használható.';
      if (hasPers(st, st.z)) return 'A Perzisztencia-jelző miatt a bábu innen nem léphet vissza.';
      if (pro(st)) { if (st.rs.b < 1) return 'Nincs elég Erőforrásod (1).'; st.rs.b--; }

    }
    if (a.t === 'hunt') {
      const z = a.z | 0;
      if (!pro(st) || st.hu) return 'Ebben a körben már vadásztatok.';
      if (!(z >= 1 && z <= 5) || !st.sg[z - 1]) return 'Ott nincs előkészített lap.';
      if (st.rs.b < 2) return 'Nincs elég Erőforrásod (2).';

    if (a.t === 'stage') {

      const card = st.h.r.includes(a.c) ? cardOf(a.c) : null;
      if (!card) return 'Ez a lap nincs a kezedben.';

  PEERS.map(p => p.presence).filter(p => p && p.ro === 'guest' && p.gid && p.gid !== GID && !p.left && !((KICK[p.gid] || 0) > (p.j || 0)))

    .forEach(p => ents.push({ gid: p.gid, nm: p.nm || L('Játékos', 'Player'), w: p.want || {}, rdy: !!LB && p.rdy === LB, t: p.t }));

    if (side === 'r') {
      out = `<button class="btn red" data-act='{"t":"adv"}' data-side="r">${L('Előrelépés', 'Advance')}: 0${z + 1} ${ZN[z + 1][0]}</button><button class="btn" data-act='{"t":"pers"}' data-side="r" ${hasPers(ST, z) ? 'disabled' : ''}>${L('Perzisztencia: helyben marad, itt +1', 'Persistence: stay, +1 here')}</button>`;
      return `<div class="stack" style="margin-top:12px"><p class="hint" style="margin:0">${L('A Perzisztencia-jelző +1-et ad a támadásra ezen a szakaszon, és innen a bábu nem léptethető vissza.', 'A Persistence token gives +1 to attacks at this stage, and the pawn cannot be pushed back from here.')}</p><div class="row">${out}</div></div>`;
    }
    out = `<button class="btn blue" data-act='{"t":"det"}' data-side="b">${L('Észlelés jelző', 'Detection token')} (${ST.det + 1}/5)</button><button class="btn" data-act='{"t":"intel"}' data-side="b" ${ST.h.r.length ? '' : 'disabled'}>${L('Fenyegetés-felderítés: 2 Red lap', 'Threat intel: 2 Red cards')}</button>`;

  }

    return `<div class="stack" style="margin-top:12px"><p class="hint" style="margin:0">${L('Jelölj ki egy lapot egy későbbi szakasz kategóriájából. Amikor a bábu odaér, ingyen és +1 erősséggel támadhatsz vele. A Blue 2 Erőforrásért levadászhatja.', 'Select a card from a later stage\'s category. When the pawn gets there you can attack with it for free and at +1. Blue can hunt it for 2 Resources.')}</p><div class="row">${out}</div></div>`;
  }
  if (ST.ph === 'trim') {
    const need = h.length - HAND_MAX;
    out = `<button class="btn ${side === 'r' ? 'red' : 'blue'}" data-act='${JSON.stringify({ t: 'trim', cs: sel })}' data-side="${side}" ${sel.length === need ? '' : 'disabled'}>${L(`${need} lap eldobása`, `Discard ${need} card${need > 1 ? 's' : ''}`)}</button>`;
    return `<div class="stack" style="margin-top:12px"><p class="hint" style="margin:0">${L(`A kézlimit 7 lap. Jelölj ki ${need} lapot, ezek a nyílt dobópaklira kerülnek.`, `The hand limit is 7. Select ${need} card${need > 1 ? 's' : ''}; they go to the open discard pile.`)}</p><div class="row">${out}</div></div>`;
  }
  return '';
}

function morseHTML(num) {

   <div style="min-width:0"><div class="row" style="justify-content:space-between"><div><div class="lbl" style="color:var(--soft)">TIE-BREAK // ${L('PÁRBAJ', 'DUEL')}</div><div class="disp" style="font-size:22px">${L('KRIPTOPÁRBAJ', 'CRYPTO DUEL')}</div></div><div class="disp" style="font-size:36px">${ROMAN[lv]}</div></div>

}
function refHTML(bare) {

  for (let r = 0; r < 5; r++) t += `<tr><th>${r + 1}</th>` + [0, 1, 2, 3, 4].map(c => `<td>${PB[r * 5 + c] === 'I' ? 'I/J' : PB[r * 5 + c]}</td>`).join('') + '</tr>';
  t += '</table>';
  const m = MORSE_D.map((s, d) => `<div class="mrow"><b style="width:14px">${d}</b>${s.split('').map(x => `<i style="width:${x === '.' ? 6 : 18}px"></i>`).join('')}</div>`).join('');
  const open = bare ? '' : `<details class="ref"><summary>${L('Segédlet: morze, Polybius, ábécé', 'Reference: Morse, Polybius, alphabet')}</summary>`;
  return `${open}<div class="reftbl">
   <div><div class="lbl">${L('A · Morze számjegyek', 'A · Morse digits')}</div>${m}</div>
   <div><div class="lbl">${L('E / V · Polybius-rács', 'E / V · Polybius square')}</div>${t}<p style="margin:6px 0 0">${L('Példa: 25 = 2. sor, 5. oszlop = K.', 'Example: 25 = row 2, column 5 = K.')}</p></div>
   <div><div class="lbl">${L('B · Caesar / C · Kulcsszavas', 'B · Caesar / C · Keyword')}</div><p style="margin:4px 0">${L('Caesar: minden titkos betűt tolj vissza az A szám szerint az ábécében.', "Caesar: shift every cipher letter back by A's number in the alphabet.")}</p><p style="margin:4px 0">${L('Kulcsszavas: írd le a kulcsszó betűit ismétlés nélkül, utána a maradék ábécét. Ez kerül a normál ábécé alá; a titkos betűt alul keresd, a megfejtés fölötte van.', 'Keyword: write the keyword letters without repeats, then the rest of the alphabet. Put this row under the normal alphabet; find the cipher letter below, the plain letter is above it.')}</p><p style="margin:4px 0">${L('Sövény (D): 3 sorba cikcakkban írták, majd soronként összeolvasták.', 'Rail fence (D): written zigzag on 3 rails, then read row by row.')}</p><div class="mono" style="font-size:12px;overflow-x:auto">ABCDEFGHIJKLMNOPQRSTUVWXYZ</div></div>
  </div>${bare ? '' : '</details>'}`;
}
function duelHTML() {

    const fields = c.f.map((f, i) => `<label for="ans-${s}-${i}">${c.l === 5 ? L('MEGFEJTÉS (A TELJES MONDAT)', 'SOLUTION (THE WHOLE SENTENCE)') : f.i + L(' TÖREDÉK SZAVA', ' FRAGMENT WORD')}</label><input type="text" id="ans-${s}-${i}" data-draft="${s}" data-i="${i}" autocomplete="off" spellcheck="false" value="${esc(DRAFT[s][i] || '')}" ${out || !canAct(s) ? 'disabled' : ''}>`).join('');
    return `<div class="frame cut"><div class="fi ans"><div class="row" style="justify-content:space-between"><h3><span class="${s}">${SIDE[s]}</span> ${L('Kriptográfus', 'Cryptographer')}</h3>${d.hp.includes(s) ? `<span class="tag">${L('SEGÍTSÉGET KÉRT', 'ASKED FOR HELP')}</span>` : ''}${out ? `<span class="tag tr">${L('KIESETT', 'OUT')}</span>` : ''}</div>
      ${fields}<div class="row" style="margin-top:10px"><button class="btn ${s === 'r' ? 'red' : 'blue'}" data-ans="${s}" ${out || !canAct(s) ? 'disabled' : ''}>${L('Beküldöm', 'Submit')}</button>

  }).join('');

}

  cj: () => L('A Blue titokban kiválasztotta a koronaékszert.', 'Blue secretly chose its crown jewel.'),

const mmss = ms => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;

function roundBrief(gm) {
  const S = [];

    : [L('Húzás', 'Draw'), L('mindkét csapat 5 lapra egészít ki.', 'both teams fill their hands to 5 cards.')]);
  S.push([L('Támadás', 'Attack'), L('a Red lefordítva kijátszik egy lapot a bábu szakaszának kategóriájából.', "Red plays a card face down from the category of the pawn's stage.") + (gm === 2 ? L(' Erős (4–5) lap Zajt kelt.', ' A strong (4–5) card makes noise.') : '')]);
  S.push([L('Védekezés', 'Defense'), L('a Blue azonos kategóriájú lappal védekezik, vagy passzol.', 'Blue defends with a card of the same category, or passes.') + (gm === 2 ? L(' A koronaékszer szakaszán +1.', ' +1 at the crown jewel stage.') : '')]);
  S.push([L('Felfedés és eredmény', 'Reveal and result'), L('erősség + szerepkör-bónusz + tartós kontrollok. A nagyobb nyer, döntetlennél kriptopárbaj.', 'strength + role bonus + persistent controls. Higher wins; a tie means a crypto duel.') + (gm ? L(' A lapok árát (az erősségüket) Erőforrásból fizetitek.', ' Each card costs its strength in Resources.') : '')]);
  if (gm) S.push([L('Jutalom', 'Reward'), L('az ütközés nyertese jutalmat választ (például előrelépés, Perzisztencia vagy Észlelés jelző).', 'the winner of the clash picks a reward (for example advance, Persistence or a Detection token).')]);
  S.push([L('Megerősítés', 'Fortify'), L('a Blue lerakhat egy „Tartós” lapot kontrollként.', 'Blue may place a "Persistent" card as a control.')]);
  if (gm === 2) S.push([L('Előkészítés', 'Staging'), L('a Red 1 Erőforrásért lefordítva letehet egy lapot egy későbbi szakaszhoz.', 'for 1 Resource Red may stage a card face down at a later stage.')]);
  S.push([L('Takarítás', 'Cleanup'), L('a körjelző lép. A 10. kör végén a Blue nyer.', 'the round marker advances. At the end of round 10, Blue wins.')]);
  return S;
}

  if (ST.ph === 'def') {
    const n = cnt('b', c => c.c === z), bonus = ST.ct[z - 1].length + (has(ST, 'b', 'admin') && z === 3 ? 1 : 0);
    if (sees('b')) A.push(n ? L(`${me('b')} ${n} db ${zn} lappal védekezhettek. Jelöljétek ki, és nyomjátok meg a „Védekezem lefordítva” gombot.`, `${me('b')} can defend with ${n} ${zn} card${n > 1 ? 's' : ''}. Select one and press "Defend face down".`) : L(`Nincs ${zn} lapotok, ezért passzolnotok kell.`, `You have no ${zn} card, so you must pass.`));
    else A.push(L('A Blue most dönt a védekezésről. Fedjétek fel a Blue kezét a lépéshez.', "Blue is deciding on the defense. Reveal Blue's hand to make the move."));
    A.push(L(`Passz esetén a támadás automatikusan sikeres${z === 5 ? ', és mivel a Red a Cél szakaszon áll, a Red megnyeri a játékot' : ', és a Red bábu előre lép'}.`, `On a pass the attack succeeds automatically${z === 5 ? ', and since Red is at the Objective stage, Red wins the game' : ' and the Red pawn advances'}.`));
    if (bonus) A.push(L(`A Blue bónusza ebben a kategóriában: +${bonus} (${[ST.ct[z - 1].length ? ST.ct[z - 1].length + ' tartós kontroll' : '', has(ST, 'b', 'admin') && z === 3 ? 'Rendszergazda' : ''].filter(Boolean).join(', ')}).`, `Blue's bonus in this category: +${bonus} (${[ST.ct[z - 1].length ? ST.ct[z - 1].length + ' persistent control' + (ST.ct[z - 1].length > 1 ? 's' : '') : '', has(ST, 'b', 'admin') && z === 3 ? 'System Administrator' : ''].filter(Boolean).join(', ')}).`));
    if (has(ST, 'b', 'soc')) A.push(L('SOC elemző: ha legalább 3-mal nyertek, +1 Észlelés jelzőt kaptok.', 'SOC Analyst: if you win by 3 or more, you get +1 Detection token.'));
    A.push(L(`Ha nyertek, ${ST.det + 1 >= 5 ? 'megvan az 5. Észlelés jelző, és a Blue nyer' : 'kaptok 1 Észlelés jelzőt'}. Döntetlennél kriptopárbaj jön.`, `If you win, ${ST.det + 1 >= 5 ? 'that is the 5th Detection token and Blue wins' : 'you get 1 Detection token'}. A tie leads to a crypto duel.`));
    O.push(L('A Red lefordított lapja már az asztalon van, a Red most vár.', "Red's face-down card is on the table; Red is waiting."));
  }
  if (ST.ph === 'duel' && ST.du) {
    const d = ST.du, task = ['A + B', 'A + B + C', 'A + B + C + D', 'A + B + C + D + E', L('egy nagy feladat', 'one big puzzle')][d.lv - 1], lv = ['I', 'II', 'III', 'IV', 'V'][d.lv - 1];
    A.push(L(`${lv}. szintű párbaj: ${task}. A két Kriptográfus egyszerre fejt, 5 perc alatt.`, `Level ${lv} duel: ${task}. Both Cryptographers solve at the same time, within 5 minutes.`));
    if (d.lv < 5) A.push(L('Sorrend: az A morzejel adja a B Caesar-eltolását, a B megfejtése a C kulcsszava. A D és az E független, bármikor fejthető. A segédtáblák lent lenyithatók.', "Order: the Morse code in A gives B's Caesar shift, and B's solution is C's keyword. D and E are independent and can be solved any time. The reference tables can be opened below."));
    A.push(L('Aki előbb helyesen beküldi az összes szót, megnyeri az ütközést. Hibás beküldés után az a csapat kiesik, a másik folytathatja.', 'Whoever first submits all words correctly wins the clash. After a wrong submission that team is out, and the other may continue.'));
    A.push(L('Mindkét Kriptográfus egyszer kérhet segítséget a csapatától. Ha lejár az idő, a támadás sikertelen, de a Blue nem kap Észlelés jelzőt.', 'Each Cryptographer may ask their team for help once. If time runs out, the attack fails but Blue gets no Detection token.'));
    if (d.out) A.push(L(`${d.out.split('').map(s => SIDE[s]).join(' és ')} már hibázott ebben a párbajban.`, `${d.out.split('').map(s => SIDE[s]).join(' and ')} already made a mistake in this duel.`));
  }
  if (ST.ph === 'cj') { A.push(L('A Blue titokban kiválasztja a koronaékszert (egy szakaszt). Ott minden védekezése +1-et kap. A Red ezt nem látja.', 'Blue secretly picks its crown jewel (one stage). Every defense there gets +1. Red cannot see it.')); O.push(L('A Red vár.', 'Red is waiting.')); }
  if (ST.ph === 'rew') A.push(ST.rw === 'r' ? L('A Red választ: előrelép a következő szakaszra, vagy helyben marad, és Perzisztencia-jelzőt tesz le (+1 itt, és innen nem léptethető vissza).', 'Red picks: advance to the next stage, or stay and place a Persistence token (+1 here, and the pawn cannot be pushed back from here).') : L('A Blue választ: Észlelés jelző, Fenyegetés-felderítés (2 Red lap megtekintése) vagy Kiűzés (egy Perzisztencia-jelző levétele).', 'Blue picks: a Detection token, threat intel (look at 2 Red cards) or eviction (remove a Persistence token).'));
  if (ST.ph === 'stg') A.push(L('A Red 1 Erőforrásért lefordítva letehet egy lapot egy későbbi szakasz mellé (körönként egyet, szakaszonként legfeljebb egyet), majd lezárja a kört.', 'For 1 Resource Red may stage one card face down at a later stage (one per round, at most one per stage), then ends the round.'));
  if (ST.ph === 'trim') A.push(L(`A ${SIDE[ST.tr]} kezében 7-nél több lap van, a többletet el kell dobni.`, `${SIDE[ST.tr]} has more than 7 cards and must discard the excess.`));
  if (adv(ST) && ['atk', 'def', 'fort'].includes(ST.ph)) A.push(L(`Erőforrás: Red ${ST.rs.r}, Blue ${ST.rs.b}. Minden kör elején a Red +4, a Blue +3 jár (legfeljebb 10). A lap ára az erőssége, a kontrollé erősség − 2.`, `Resources: Red ${ST.rs.r}, Blue ${ST.rs.b}. Each round Red gains +4 and Blue +3 (max 10). A card costs its strength; a control costs strength − 2.`));
  if (ST.ph === 'fort') {
    const tn = cnt('b', c => c.t);
    const canSecond = has(ST, 'b', 'ciso') && !ST.u.ciso && ST.fc === 1;
    if (ST.fc === 0) A.push(sees('b') ? (tn ? L(`${me('b')} ${tn} db „Tartós” lap van a kezetekben. Egyet kirakhattok kontrollként: a játék végéig +1-et ad minden védekezésnek a saját kategóriájában (kategóriánként legfeljebb 2).`, `You have ${tn} "Persistent" card${tn > 1 ? 's' : ''} in hand. You may place one as a control: until the end of the game it gives +1 to every defense in its category (at most 2 per category).`) : L('Nincs „Tartós” lap a kezetekben, ebben a körben nem raktok le kontrollt.', 'You have no "Persistent" card in hand, so you place no control this round.')) : L('A Blue most kirakhat egy „Tartós” lapot kontrollként.', 'Blue may now place a "Persistent" card as a control.'));
    else if (canSecond) A.push(L('CISO: egyszer a játék során lerakhattok egy második kontrollt is ebben a körben.', 'CISO: once per game you may place a second control this round.'));
    else A.push(L('Ebben a körben már lerakhattok kontrollt.', 'You have already placed a control this round.'));
    if (has(ST, 'b', 'ir') && !ST.u.ir && z > 1) A.push(L(`Incidenskezelő: egyszer a játék során visszaléptethetitek a Red bábut ${zn} szakaszról az előzőre.`, `Incident Handler: once per game you may push the Red pawn back from ${zn} to the previous stage.`));
    A.push(ST.rd >= 10 ? L('Ez az utolsó kör. Ha lezárjátok, és a Red nem ért célba, a Blue nyer.', 'This is the last round. If you end it and Red has not reached the objective, Blue wins.') : (adv(ST) ? L('Ha végeztetek, lépjetek tovább. A következő körben mindkét csapat 2 lapot húz és Erőforrást kap.', 'When done, move on. Next round both teams draw 2 cards and gain Resources.') : L('Ha végeztetek, nyomjátok meg a „Kör vége” gombot. Utána mindkét csapat 5 lapra húz, és a Red támad.', 'When done, press "End round". Then both teams draw up to 5 cards and Red attacks.')));
    O.push(L('A Red most vár a következő körre.', 'Red is waiting for the next round.'));
  }
  if (!A.length) return '';
  return `<details class="help cut" ${HELPOPEN ? 'open' : ''}><summary><span class="lbl">${L('Mit tehettek most?', 'What can you do now?')}</span>${status ? `<span class="lbl hs">${status}</span>` : ''}</summary>
   <ul>${A.map(x => `<li>${x}</li>`).join('')}${O.map(x => `<li class="oth">${x}</li>`).join('')}</ul>
   <div class="row" style="margin-top:4px"><button class="btn ghost" data-a="rules">${L('Teljes szabályzat', 'Full rules')}</button><button class="btn ghost" data-a="cref">${L('Kripto segédlet', 'Crypto reference')}</button></div></details>`;
}

function langHTML() {
  return `<span class="lang" role="group" aria-label="${L('Nyelv', 'Language')}"><button class="btn" data-a="lang" data-v="hu" aria-pressed="${LANG === 'hu'}" lang="hu">HU</button><button class="btn" data-a="lang" data-v="en" aria-pressed="${LANG === 'en'}" lang="en">EN</button></span>`;
}
function render() {
  const a = document.activeElement, fid = a && a.id, pos = a && a.selectionStart;
  const tmode = TEAM ? L('SZEREPKÖRÖS', 'ROLE-BASED') + ' · ' + (MY ? SIDE[MY].toUpperCase() + (MYRO.length ? ' · ' + MYRO.map(k => roleKeyName(MY, k).toUpperCase()).join(', ') : '') : L('NÉZŐ', 'SPECTATOR')) : '';
  const mode = SPEC ? L('KÖZVETÍTÉS', 'LIVE BROADCAST') : TEAM ? tmode : { local: L('HELYI JÁTÉK', 'LOCAL GAME'), host: 'ONLINE · ' + (MY ? SIDE[MY].toUpperCase() : ''), guest: 'ONLINE · ' + (MY ? SIDE[MY].toUpperCase() : ST ? L('NÉZŐ', 'SPECTATOR') : L('CSATLAKOZÁS', 'JOINING')) }[MODE] || '';
  document.getElementById('app').innerHTML = `<div class="accent"><i></i><i></i></div>
   <header class="top"><span class="logo"><span class="r">RED</span><small>VS</small><span class="b">BLUE</span></span>${mode ? `<span class="pill">${mode}</span>` : ''}${SCREEN === 'game' && ST ? `<span class="pill">${gmName(ST.gm)}</span>` : ''}${MODE !== 'local' && CODE && SCREEN === 'game' ? `<span class="pill">${L('KÓD', 'CODE')} ${esc(CODE.toUpperCase())}</span>` : ''}<span class="sp"></span>${SCREEN === 'game' ? rulesBtns() : ''}${langHTML()}
    ${SCREEN === 'game' && ST && ST.ph !== 'end' && (MODE === 'local' || MY) && !inLobby() && !(TEAM && ST.ph === 'setup') ? '<button class="btn abort" data-a="abortask" aria-expanded="' + ABORTASK + '">Abort</button>' : ''}${SCREEN === 'game' ? `<button class="btn" data-a="menu">${L('Kilépés a menübe', 'Exit to menu')}</button>` : ''}</header>
   ${ABORTASK && SCREEN === 'game' && ST && ST.ph !== 'end' ? `<div class="abortbar" role="alertdialog" aria-label="${L('Játék megszakítása', 'Abort game')}"><b>${L('Biztosan megszakítod a játékot? Nem lesz győztes, és a játszma nem folytatható.', 'Abort the game? There will be no winner and the game cannot be resumed.')}</b><div class="row"><button class="btn abort" data-a="abortyes">${L('Igen, megszakítom', 'Yes, abort')}</button><button class="btn" data-a="abortno">${L('Mégse', 'Cancel')}</button></div></div>` : ''}
   <main class="wrap">${SCREEN === 'menu' ? menuHTML() : gameHTML()}</main>${RULES ? rulesHTML() : ''}${CREF ? crefHTML() : ''}${TOAST ? `<div class="toast" role="status">${esc(tr(TOAST))}</div>` : ''}`;
  if (fid) { const el = document.getElementById(fid); if (el && !el.disabled) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) { } } }
  tick();
}

function tick() {
  if (!ST || ST.ph !== 'duel' || !ST.du) return;
  const now = Date.now() + (MODE === 'guest' ? HOSTOFF : 0);
  const left = Math.max(0, ST.du.t0 + DUEL_MS - now);
  const t = document.getElementById('tleft'), b = document.getElementById('tbar');
  if (t) t.textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}`;
  if (b) b.style.width = (left / DUEL_MS * 100) + '%';
  if (left <= 0 && MODE !== 'guest') { const r = act(ST, 'r', { t: 'timeout' }); if (!r.err) { ST = r.st; afterChange(); persist(); publishHost(); render(); } }
}
setInterval(tick, 500);

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-a]'); if (!t || t.disabled) return;
  const side = t.dataset.side;
  if (t.dataset.card) {
    const ch = t.dataset.card, s = cardOf(ch).s;
    if (!viewSides().includes(s)) return;
    const multi = ST.ph === 'atk' && s === 'r' && !hasCat(ST, 'r', ST.z) && !ST.rp;
    const cur = SEL[s];
    const trimN = ST.ph === 'trim' && s === ST.tr ? ST.h[s].length - HAND_MAX : 0;
    if (trimN) SEL[s] = cur.includes(ch) ? cur.filter(x => x !== ch) : (cur.length < trimN ? [...cur, ch] : cur);
    else if (multi) SEL[s] = cur.includes(ch) ? cur.filter(x => x !== ch) : (cur.length < 3 ? [...cur, ch] : cur);
    else SEL[s] = cur[0] === ch ? [] : [ch];
    return render();
  }
  if (t.dataset.n) { dispatch(side, { t: 'cfg', n: +t.dataset.n, ro: ST.cfg[side].ro }); return; }
  if (t.dataset.act) { dispatch(side, JSON.parse(t.dataset.act)); return; }
  if (t.dataset.ans) { const s = t.dataset.ans; dispatch(s, { t: 'ans', a: DATA.crypto[dec(ST.du.c)].f.map((f, i) => DRAFT[s][i] || '') }); return; }
  switch (t.dataset.a) {
    case 'local': MODE = 'local'; ST = newGame((Math.random() * 4294967296) >>> 0, GMSEL); lastPh = 'setup'; SCREEN = 'game'; persist(); return render();
    case 'resume': MODE = 'local'; ST = store.get('rvb-local'); lastPh = ST.ph; SCREEN = 'game'; return render();
    case 'host': return hostGame(side);
    case 'rehost': return hostGame(null, store.get('rvb-host'));
    case 'join': return joinGame(document.getElementById('joincode').value);
    case 'watch': return joinGame(document.getElementById('joincode').value, true);
    case 'hostteam': return hostTeam();
    case 'reteam': return hostTeam(store.get('rvb-team'));
    case 'tside': ME = { sd: t.dataset.v, ro: [], rdy: '' }; return teamChanged();
    case 'tready': ME = { ...ME, rdy: ME.rdy === LB ? '' : LB }; return teamChanged();
    case 'tstart': return teamStart();
    case 'tkick': KICK[t.dataset.g] = Date.now(); return teamChanged();
    case 'go':
      if (MODE === 'host') { GO = { ...GO, h: true }; publishHost(); return render(); }
      if (MODE === 'guest' && GROOM) { GO = { ...GO, g: true }; GROOM.set({ go: true }); return render(); }
      return;
    case 'show': SHOW[side] = true; return render();
    case 'hide': SHOW[side] = false; SEL[side] = []; return render();
    case 'menu': ABORTASK = false; return leave();
    case 'lang': return setLang(t.dataset.v);
    case 'gm': GMSEL = +t.dataset.v; store.set('rvb-gm', GMSEL); return render();
    case 'cat': CATSEL = CATSEL === +t.dataset.v ? 0 : +t.dataset.v; return render();
    case 'cref': CREF = true; RULES = false; return render();
    case 'crefclose': CREF = false; return render();
    case 'rules': CREF = false; RULES = true; render(); { const b = document.querySelector('.rulesbody'); if (b) b.scrollTop = 0; } return;
    case 'rulesclose': RULES = false; return render();
    case 'abortask': ABORTASK = !ABORTASK; return render();
    case 'abortno': ABORTASK = false; return render();
    case 'abortyes': ABORTASK = false; dispatch(MODE === 'local' ? (activeSide() || 'r') : MY, { t: 'abort' }); return;
    case 'again':
      if (MODE === 'local') { ST = newGame((Math.random() * 4294967296) >>> 0, ST.gm); lastPh = 'setup'; persist(); return render(); }
      if (MODE === 'host') { ST = newGame((Math.random() * 4294967296) >>> 0, ST.gm); lastPh = 'setup'; if (TEAM) { LB = Math.random().toString(36).slice(2, 8); ME = { ...ME, rdy: '' }; rebuildRoster(); } persist(); publishHost(); return render(); }
      return toast('Új játékot a házigazda indíthat.');
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.role) { const s = t.dataset.role, ro = ST.cfg[s].ro.slice(); ro[+t.dataset.i] = t.checked ? 1 : 0; dispatch(s, { t: 'cfg', n: ST.cfg[s].n, ro }); }
  if (t.dataset.trole) { const k = t.dataset.trole; ME = { ...ME, ro: t.checked ? [...ME.ro.filter(x => x !== k), k] : ME.ro.filter(x => x !== k) }; return teamChanged(); }
  if (t.dataset.talt) { ST = clone(ST); ST.cfg.alt = t.checked ? 1 : 0; return teamChanged(); }
  if (t.id === 'nm') { KEEP.nm = t.value.trim().slice(0, 24); store.set('rvb-nm', KEEP.nm); return teamChanged(); }
  if (t.dataset.alt) dispatch(MODE === 'local' ? 'r' : MY, { t: 'alt', v: t.checked });
});
document.addEventListener('input', e => { const t = e.target; if (t.id === 'joincode' || t.id === 'nm') KEEP[t.id] = t.id === 'nm' ? t.value.slice(0, 24) : t.value; if (t.dataset.draft) DRAFT[t.dataset.draft][+t.dataset.i] = t.value; });
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('help')) HELPOPEN = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (RULES || CREF)) { RULES = false; CREF = false; return render(); }
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'joincode') { e.preventDefault(); joinGame(t.value); }
  else if (t.id === 'nm') { e.preventDefault(); t.blur(); }
  else if (t.dataset && t.dataset.draft) { const b = document.querySelector(`[data-ans="${t.dataset.draft}"]`); if (b && !b.disabled) b.click(); }
});

// fit: on large screens scale the whole page up so the table fills the display instead of floating in a 1280px column
function fit() {
  const z = Math.max(1, Math.min(window.innerWidth / 1400, window.innerHeight / 820, 2.4));
  document.documentElement.style.setProperty('--z', z);
  document.body.style.zoom = z > 1.04 ? z.toFixed(3) : '';
}
window.addEventListener('resize', fit);
fit();
applyLang();
render();
getRoom();

</script>
</body></html>
