<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Red vs Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: HUD game table. Board column (attack chain) beside the play column; single grey world like the printed cards. */
:root{
  --ground:#A3A3A3; --paper:#B9B9B9; --ink:#111111; --ink2:#2a2a2a; --mute:#4a4a4a;
  --red:#E6492D; --blue:#2C9AD6; --white:#FFFFFF; --soft:#D6D6D6; --ok:#2f8f4e;
  --btn-bg:#123A63; --btn-bg2:#1A4F85; --btn-fg:#FFA13D; --btn-on-bg:#FF8A12; --btn-on-fg:#0B2B4C;
  --f-disp:'Orbitron','Arial Black',sans-serif; --f-body:'Chakra Petch','Segoe UI',system-ui,sans-serif; --f-mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;margin:0}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,.hc:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono);letter-spacing:.14em}
.disp{font-family:var(--f-disp);font-weight:900}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
.cut{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.frame{background:var(--ink);padding:2px}
.frame>.fi{background:var(--paper);padding:12px 14px;height:100%;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.panel{background:var(--ink);color:var(--soft);padding:14px 16px}
.panel h3{color:var(--white)}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
h3{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.r{color:var(--red)}.b{color:var(--blue)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;padding:2px 7px;background:var(--ink);color:var(--white);white-space:nowrap}
.tag.tr{background:var(--red);color:var(--ink)}.tag.tb{background:var(--blue);color:var(--ink)}.tag.tg{background:var(--ground);color:var(--ink);border:1.5px solid var(--ink)}
.btn{border:0;background:var(--btn-bg);color:var(--btn-fg);padding:10px 16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px;-webkit-text-fill-color:var(--btn-fg);opacity:1;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:hover{background:var(--btn-bg2)}
.btn.red{box-shadow:inset 6px 0 0 var(--red)}.btn.blue{box-shadow:inset 6px 0 0 var(--blue)}
.btn.ghost{box-shadow:inset 0 0 0 2px var(--btn-fg)}
.btn:active,.btn[aria-pressed=true],.seg button[aria-pressed=true],.seg button:active{background:var(--btn-on-bg);color:var(--btn-on-fg);-webkit-text-fill-color:var(--btn-on-fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top .btn.abort,.btn.abort{background:var(--btn-on-bg);color:var(--btn-on-fg);-webkit-text-fill-color:var(--btn-on-fg)}
.top .btn.abort:hover,.btn.abort:hover{background:#FFA040}
.top .btn.abort:active,.btn.abort:active,.top .btn.abort[aria-expanded=true]{background:var(--btn-bg);color:var(--btn-fg);-webkit-text-fill-color:var(--btn-fg)}
.abortbar{background:var(--btn-bg);color:var(--white);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:4px solid var(--btn-on-bg)}
.btn.hostred{background:var(--btn-on-bg);color:var(--btn-on-fg);-webkit-text-fill-color:var(--btn-on-fg);box-shadow:inset 6px 0 0 var(--red)}
.btn.hostred:hover{background:#FFA040}
.btn.hostred:active{background:var(--btn-bg);color:var(--btn-fg);-webkit-text-fill-color:var(--btn-fg)}
.btn[aria-pressed=true][disabled],.seg button[aria-pressed=true][disabled]{opacity:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
/* top bar */
.top{background:var(--ink);color:var(--white);display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.04em}
.logo small{font-size:11px;vertical-align:middle;margin:0 4px;color:var(--soft)}
.top .sp{flex:1}
.top .btn{clip-path:none;padding:6px 10px;font-size:11px}
.pill{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;padding:3px 8px;border:1.5px solid var(--soft)}
.accent{height:6px;display:flex}.accent i{flex:1}.accent i:nth-child(1){background:var(--red)}.accent i:nth-child(2){background:var(--blue)}
/* menu */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;margin-top:18px}
.hero .big{font-family:var(--f-disp);font-weight:900;font-size:clamp(56px,10vw,112px);line-height:.9}
.hero .big span.vs{font-size:.32em;vertical-align:middle;color:var(--ink)}
.choices{display:grid;gap:12px}
.choice{display:block;text-align:left;width:100%;border:0;padding:2px;background:var(--ink);color:var(--ink)}
.choice .fi{padding:14px 16px;background:var(--paper);color:var(--ink);clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.choice b{display:block;font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.choice .hint{color:inherit}
button.choice{background:var(--btn-bg)}
button.choice .fi{background:var(--btn-bg);color:var(--btn-fg);-webkit-text-fill-color:var(--btn-fg)}
button.choice:hover .fi{background:var(--btn-bg2)}
button.choice:active .fi{background:var(--btn-on-bg);color:var(--btn-on-fg);-webkit-text-fill-color:var(--btn-on-fg)}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.cats>div{flex:1 1 110px;background:var(--ink);color:var(--white);padding:10px;display:flex;flex-direction:column;gap:6px}
.cats svg{width:26px;height:26px}
input[type=text]{font-family:var(--f-mono);font-size:18px;letter-spacing:.2em;text-transform:uppercase;padding:9px 10px;border:2px solid var(--ink);background:var(--white);color:var(--ink);width:100%;min-width:0}
/* setup */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:0;background:var(--btn-bg);color:var(--btn-fg);-webkit-text-fill-color:var(--btn-fg);padding:10px 0;font-family:var(--f-disp);font-weight:900}
.seg button:hover{background:var(--btn-bg2)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}

.rolechk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--mute)}
.rolechk input{margin-top:4px;width:18px;height:18px;accent-color:var(--ink)}
.rolechk small{display:block;color:var(--ink2)}
/* game grid */
.game{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}.game>.stack:last-child{order:-1}.hero{grid-template-columns:minmax(0,1fr)}}
/* board */
.board{background:var(--ink);padding:2px}
.board .fi{background:var(--ground);padding:10px}
.zone{display:grid;grid-template-columns:minmax(0,1fr) 52px 64px;gap:8px;align-items:center;margin-bottom:8px}
.zplate{background:var(--ink);color:var(--white);padding:8px 10px;display:flex;gap:8px;align-items:center;min-width:0}
.zplate svg{width:22px;height:22px;flex:none}
.zplate .zn{font-size:13px;font-weight:700;text-transform:uppercase;line-height:1.15}
.zplate .ze{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--red);text-transform:uppercase}
.zone.cur .zplate{box-shadow:0 0 0 3px var(--red)}
.pawnslot{width:52px;height:52px;border-radius:50%;border:2px dotted var(--ink);display:flex;align-items:center;justify-content:center}
.pawn{width:44px;height:44px;border-radius:50%;background:var(--ink);border:3px dashed var(--red);color:var(--red);font-family:var(--f-disp);font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.det{height:52px;border:2px dashed var(--blue);background:rgba(44,154,214,.18);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:900;font-size:22px;color:var(--white)}
.det.on{background:var(--blue);border-style:solid;color:var(--ink)}
.ctrlrow{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;margin-top:-4px}
.ctrlrow span{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;background:var(--blue);color:var(--ink);padding:1px 6px}
.track{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:6px}
.track div{border:2px solid var(--ink);text-align:center;font-family:var(--f-disp);font-weight:900;font-size:13px;padding:5px 0}
.track div.done{background:rgba(17,17,17,.18)}
.track div.now{background:var(--ink);color:var(--white)}
.track div.last{color:var(--blue)}
.track div.last.now{color:var(--blue)}
/* phase */
.phase{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--white);padding:12px 14px;flex-wrap:wrap}
.phase .who{font-family:var(--f-disp);font-weight:900;font-size:18px}
.phase .steps{display:flex;gap:3px;margin-left:auto}
.phase .steps span{font-family:var(--f-mono);font-size:10px;padding:2px 5px;border:1px solid var(--mute);color:var(--mute)}
.phase .steps span.on{border-color:var(--white);color:var(--ink);background:var(--white)}
.hint{font-size:14px;color:var(--ink2)}
/* cards */
.hand{display:flex;gap:10px;flex-wrap:wrap}
.hc{color:var(--ink);position:relative;width:148px;min-height:206px;background:var(--ink);padding:2px;border:0;text-align:left;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:transform .15s}
.hc .ci{background:var(--ground);height:100%;min-height:202px;padding:8px 9px;display:flex;flex-direction:column;gap:6px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.hc .bar{height:4px;margin:-8px -9px 2px;}
.hc.sr .bar{background:var(--red)}.hc.sb .bar{background:var(--blue)}
.hc .top2{display:flex;gap:6px;align-items:center}
.hc .str{font-family:var(--f-disp);font-weight:900;font-size:34px;line-height:1}
.hc .cat{background:var(--ink);color:var(--white);display:flex;align-items:center;gap:5px;padding:4px 6px;flex:1;min-width:0}
.hc .cat svg{width:16px;height:16px;flex:none}
.hc .cat span{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .tt{background:var(--ink);color:var(--white);font-weight:700;font-size:12.5px;line-height:1.15;text-transform:uppercase;padding:6px 7px;flex:1}
.hc .en{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.04em;text-transform:none;font-weight:400;margin-top:4px}
.hc.sr .en{color:var(--red)}.hc.sb .en{color:var(--blue)}
.hc .tags{display:flex;gap:4px;min-height:18px}
.hc.playable{cursor:pointer}
.hc.dim{opacity:.55}
.hc.sel{transform:translateY(-8px)}
.hc.sel{background:var(--red)}.hc.sb.sel{background:var(--blue)}
.hc.sel .ci{box-shadow:inset 0 0 0 3px var(--ink)}
.back{width:148px;height:206px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--white);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.back .disp{font-size:22px}
.back.sr{box-shadow:inset 0 0 0 6px var(--red)}.back.sb{box-shadow:inset 0 0 0 6px var(--blue)}
.back.small{width:46px;height:64px}.back.small .disp{font-size:9px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:600px){.detail{grid-template-columns:minmax(0,1fr)}.hc{width:calc(50% - 5px)}.back{width:calc(50% - 5px)}}
.case{border:2px solid var(--ink);padding:8px 10px;font-size:13px}
/* clash */
.clash{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.clash .side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.clash .sum{font-family:var(--f-disp);font-weight:900;font-size:28px}
.clash .vs{font-family:var(--f-disp);font-weight:900;font-size:22px}
.result{font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;text-align:center}
.result.rw{background:var(--red);color:var(--ink)}.result.bw{background:var(--blue);color:var(--ink)}.result.tw{background:var(--ink);color:var(--white)}
/* crypto */
.kcard{background:var(--ink);color:var(--white);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.kcard.nom{grid-template-columns:minmax(0,1fr)}
.morse{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 10px;border-right:2px dashed var(--ground)}
.morse i{display:block;width:12px;background:var(--white)}
.morse i.dot{height:12px;border-radius:50%}.morse i.dash{height:34px;border-radius:3px}
.morse hr{width:30px;border:0;border-top:2px dashed var(--ground);margin:6px 0}
.frag{border:2px solid var(--ground);padding:8px 10px;margin-top:10px;background-image:radial-gradient(rgba(163,163,163,.22) 1.2px,transparent 1.6px);background-size:14px 14px}
.frag .cx{font-family:var(--f-mono);font-size:clamp(17px,3vw,26px);letter-spacing:.22em;text-align:center;padding:6px 0;overflow-wrap:anywhere}
.duelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.timer{height:10px;background:var(--ink);position:relative;overflow:hidden}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .5s linear}
.ans label{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;margin:8px 0 3px}
details.ref{margin-top:4px}
details.ref summary{cursor:pointer;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.reftbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:8px;font-size:13px}
.pb{border-collapse:collapse}.pb td,.pb th{border:1.5px solid var(--ink);width:30px;height:28px;text-align:center;font-family:var(--f-disp);font-size:12px}
.pb th{background:var(--ink);color:var(--white)}
.mrow{display:flex;gap:8px;align-items:center;font-family:var(--f-mono)}
.mrow i{display:inline-block;height:6px;background:var(--ink);margin-right:3px;border-radius:3px}
/* log */
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:260px;overflow:auto}
.log li{padding:5px 0;border-bottom:1px dashed var(--mute)}
.log li.rd{font-family:var(--f-mono);letter-spacing:.16em;color:var(--white);border-bottom-color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 16px;border-left:6px solid var(--red);max-width:min(92vw,520px);z-index:9;font-size:14px}
.end{background:var(--ink);color:var(--white);padding:22px;text-align:center}
.end .disp{font-size:clamp(34px,7vw,64px)}
.oppbox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--f-disp);font-weight:900;font-size:34px;letter-spacing:.2em;background:var(--white);padding:4px 12px;display:inline-block;user-select:all}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  if (!mine) return `<div class="frame cut"><div class="fi"><div class="row" style="justify-content:space-between"><h3>${side === 'r' ? '<span class="r">Red</span>' : '<span class="b">Blue</span>'} kéz</h3><span class="lbl">${h.length} lap</span></div><div class="oppbox" style="margin-top:8px">${h.map(() => backHTML(side, true)).join('')}</div></div></div>`;
  const hidden = MODE === 'local' && !SHOW[side];
  const ph = ST.ph, z = ST.z;
  const myTurn = activeSide() === side;
  let body;
  if (hidden) {
    body = `<div class="row" style="margin-top:8px">${h.map(() => backHTML(side, true)).join('')}</div>
     <p class="hint">${myTurn ? `A ${SIDE[side]} csapat következik. A másik csapat ne nézzen ide.` : 'A lapok rejtve vannak.'}</p>
     <button class="btn ${side === 'r' ? 'red' : 'blue'}" data-a="show" data-side="${side}">${SIDE[side]} kéz megmutatása</button>`;
  } else {
    const noMatch = !h.some(ch => cardOf(ch).c === z);
    const multi = side === 'r' && ph === 'atk' && noMatch && !ST.rp;
    body = `<div class="hand" style="margin-top:10px">${h.map(ch => {
      const c = cardOf(ch);
      const play = (ph === 'atk' && side === 'r' && (c.c === z || multi)) || (ph === 'def' && side === 'b' && c.c === z) || (ph === 'fort' && side === 'b' && c.t && ST.ct[c.c - 1].length < 2);
      return cardHTML(ch, { btn: true, sel: SEL[side].includes(ch), play: play && myTurn, dim: myTurn && !play });
    }).join('') || '<p class="hint">Nincs lap a kézben.</p>'}</div>`;
    const s1 = SEL[side][0];
    if (s1) { const c = cardOf(s1); body += `<div class="detail" style="margin-top:10px"><div class="case" style="background:var(--white)"><b>${esc(c.hu)}</b><br>${esc(c.d)}</div>${caseHTML(s1)}</div>`; }
    if (side === 'r' && ST.pk && ST.pkr) body += `<div class="panel cut" style="margin-top:10px"><span class="lbl r">Felderítő · a Blue kezében van:</span><div style="margin-top:6px">${cardHTML(ST.pk)}</div></div>`;
    if (MODE === 'local') body += `<div style="margin-top:10px"><button class="btn ghost" data-a="hide" data-side="${side}">Kéz elrejtése</button></div>`;
  }
  return `<div class="frame cut"><div class="fi"><div class="row" style="justify-content:space-between"><h3>${side === 'r' ? '<span class="r">Red</span>' : '<span class="b">Blue</span>'} kéz</h3>
    <span class="lbl">Pakli ${ST.dk[side].length} · Dobó ${ST.ds[side].length}</span></div>${body}${actionsHTML(side, hidden)}</div></div>`;
}

function roleBtn(side, key, label, enabled, a, on) {
  if (!has(ST, side, key)) return '';
  return `<button class="btn ghost" data-act='${JSON.stringify(a)}' data-side="${side}" aria-pressed="${on ? 'true' : 'false'}" ${enabled ? '' : 'disabled'}>${label}</button>`;
}
function actionsHTML(side, hidden) {
  if (activeSide() !== side || hidden) return '';
  if (!canAct(side)) return `<p class="hint" style="margin-top:10px">${PENDING ? 'Lépés elküldve, várakozás…' : ''}</p>`;
  const z = ST.z, h = ST.h[side], sel = SEL[side];
  const s1 = sel[0] ? cardOf(sel[0]) : null;
  let out = '';
  if (ST.ph === 'atk') {
    if (ST.pl.r) return '';
    const noMatch = !h.split('').some(ch => cardOf(ch).c === z);
    out += `<button class="btn red" data-act='${JSON.stringify({ t: 'play', c: sel[0] || '' })}' data-side="r" ${s1 && s1.c === z && !noMatch ? '' : 'disabled'}>Támadok lefordítva</button>`;
    if (noMatch && !ST.rp) out += `<button class="btn" data-act='${JSON.stringify({ t: 'replan', cs: sel.slice(0, 3) })}' data-side="r">Újratervezés: ${sel.length ? sel.length + ' lap cseréje' : 'csere nélkül'}</button><button class="btn ghost" data-act='{"t":"skip"}' data-side="r">Nem támadok</button>`;
    out += roleBtn('r', 'recon', `Felderítő: belenézek (${2 - ST.u.recon} maradt)`, ST.u.recon < 2 && !ST.pkr, { t: 'peek' });
    out += roleBtn('r', 'lead', ST.ov ? 'Operációvezető: aktív' : 'Operációvezető: dupla támadás', !ST.u.lead && !ST.ov, { t: 'ov' }, !!ST.ov);
    const tip = noMatch ? (ST.rp ? '' : `Nincs ${ZN[z][0]} lapod. Jelölj ki legfeljebb 3 lapot, és cseréld le őket.`) : 'Válaszd ki a lapot, amellyel támadsz. Blöffölhetsz gyenge lappal is.';
    return `<div class="stack" style="margin-top:12px"><p class="hint" style="margin:0">${tip}</p><div class="row">${out}</div></div>`;
  }
  if (ST.ph === 'def') {
    const match = h.split('').some(ch => cardOf(ch).c === z);
    out = `<button class="btn blue" data-act='${JSON.stringify({ t: 'def', c: sel[0] || '' })}' data-side="b" ${s1 && s1.c === z ? '' : 'disabled'}>Védekezem lefordítva</button><button class="btn ghost" data-act='{"t":"pass"}' data-side="b">Passz</button>`;
    const bonus = ST.ct[z - 1].length + (has(ST, 'b', 'admin') && z === 3 ? 1 : 0);
    return `<div class="stack" style="margin-top:12px"><p class="hint" style="margin:0">${match ? 'Válassz egy ' + ZN[z][0] + ' lapot.' : 'Nincs megfelelő lapod, passzolnod kell.'}${bonus ? ` Bónuszod ebben a kategóriában: +${bonus}.` : ''}</p><div class="row">${out}</div></div>`;
  }
  if (ST.ph === 'fort') {
    const canSecond = has(ST, 'b', 'ciso') && !ST.u.ciso && ST.fc === 1;
    const canCtrl = ST.fc === 0 || canSecond;
    out = `<button class="btn blue" data-act='${JSON.stringify({ t: 'ctrl', c: sel[0] || '' })}' data-side="b" ${canCtrl && s1 && s1.t ? '' : 'disabled'}>${ST.fc === 1 ? 'CISO: második kontroll' : 'Kontroll lerakása'}</button>`;
    out += roleBtn('b', 'ir', 'Incidenskezelő: bábu vissza', !ST.u.ir && ST.z > 1, { t: 'ir' });
    out += `<button class="btn" data-act='{"t":"end"}' data-side="b">${ST.rd >= 10 ? 'Utolsó kör lezárása' : 'Kör vége'}</button>`;
    return `<div class="stack" style="margin-top:12px"><p class="hint" style="margin:0">Jelölj ki egy „Tartós” lapot, ha kontrollt raksz le. Kategóriánként legfeljebb 2 lehet kint.</p><div class="row">${out}</div></div>`;
  }
  return '';
}

function morseHTML(num) {
  return num.split('').map((d, i) => (i ? '<hr>' : '') + MORSE_D[+d].split('').map(s => `<i class="${s === '.' ? 'dot' : 'dash'}"></i>`).join('')).join('');
}
function kcardHTML(c) {
  const lv = c.l;
  const frags = c.f.map(f => `<div class="frag"><span class="tag tg" style="border:0">${lv === 5 ? 'FELADAT' : f.i + ' TÖREDÉK'}</span><div class="cx" style="${lv === 5 ? 'white-space:pre-line' : ''}">${esc(lv === 5 ? f.x.split(' / ').join('\n') : f.x)}</div></div>`).join('');
  return `<div class="kcard ${c.m ? '' : 'nom'}">${c.m ? `<div class="morse" aria-label="A töredék: morzejel"><span class="tag" style="background:var(--ground);color:var(--ink)">A</span>${morseHTML(c.m)}</div>` : ''}
   <div style="min-width:0"><div class="row" style="justify-content:space-between"><div><div class="lbl" style="color:var(--soft)">TIE-BREAK // PÁRBAJ</div><div class="disp" style="font-size:22px">KRIPTOPÁRBAJ</div></div><div class="disp" style="font-size:36px">${ROMAN[lv]}</div></div>
   <div class="lbl" style="margin-top:4px;color:var(--soft)">NEHÉZSÉG: ${LEVELHU[lv]} // ${c.f.length} FELADAT // ${esc(c.code)}</div>${frags}
   <p style="font-size:13px;color:var(--soft);margin:10px 0 0">${lv === 5 ? 'Polybius-rács: minden számpár egy betű (sor, oszlop). A sorok a szavak.' : 'Sorban: az A morzeszám a B eltolása, a B szava a C kulcsa. A D és az E önálló.'}</p></div></div>`;
}
function refHTML() {
  const PB = 'ABCDEFGHIKLMNOPQRSTUVWXYZ';
  let t = '<table class="pb"><tr><th></th>' + [1, 2, 3, 4, 5].map(i => `<th>${i}</th>`).join('') + '</tr>';
  for (let r = 0; r < 5; r++) t += `<tr><th>${r + 1}</th>` + [0, 1, 2, 3, 4].map(c => `<td>${PB[r * 5 + c] === 'I' ? 'I/J' : PB[r * 5 + c]}</td>`).join('') + '</tr>';
  t += '</table>';
  const m = MORSE_D.map((s, d) => `<div class="mrow"><b style="width:14px">${d}</b>${s.split('').map(x => `<i style="width:${x === '.' ? 6 : 18}px"></i>`).join('')}</div>`).join('');
  return `<details class="ref"><summary>Segédlet: morze, Polybius, ábécé</summary><div class="reftbl">
   <div><div class="lbl">A · Morze számjegyek</div>${m}</div>
   <div><div class="lbl">E / V · Polybius-rács</div>${t}<p style="margin:6px 0 0">Példa: 25 = 2. sor, 5. oszlop = K.</p></div>
   <div><div class="lbl">B · Caesar / C · Kulcsszavas</div><p style="margin:4px 0">Caesar: minden titkos betűt tolj vissza az A szám szerint az ábécében.</p><p style="margin:4px 0">Kulcsszavas: írd le a kulcsszó betűit ismétlés nélkül, utána a maradék ábécét. Ez kerül a normál ábécé alá; a titkos betűt alul keresd, a megfejtés fölötte van.</p><p style="margin:4px 0">Sövény (D): 3 sorba cikcakkban írták, majd soronként összeolvasták.</p><div class="mono" style="font-size:12px;overflow-x:auto">ABCDEFGHIJKLMNOPQRSTUVWXYZ</div></div>
  </div></details>`;
}
function duelHTML() {
  const d = ST.du, c = DATA.crypto[dec(d.c)];
  const sides = MODE === 'local' ? ['r', 'b'] : (MY ? [MY] : []);
  const panels = sides.map(s => {
    const out = d.out.includes(s);
    const fields = c.f.map((f, i) => `<label for="ans-${s}-${i}">${c.l === 5 ? 'MEGFEJTÉS (A TELJES MONDAT)' : f.i + ' TÖREDÉK SZAVA'}</label><input type="text" id="ans-${s}-${i}" data-draft="${s}" data-i="${i}" autocomplete="off" spellcheck="false" value="${esc(DRAFT[s][i] || '')}" ${out || !canAct(s) ? 'disabled' : ''}>`).join('');
    return `<div class="frame cut"><div class="fi ans"><div class="row" style="justify-content:space-between"><h3><span class="${s}">${SIDE[s]}</span> Kriptográfus</h3>${d.hp.includes(s) ? '<span class="tag">SEGÍTSÉGET KÉRT</span>' : ''}${out ? '<span class="tag tr">KIESETT</span>' : ''}</div>
      ${fields}<div class="row" style="margin-top:10px"><button class="btn ${s === 'r' ? 'red' : 'blue'}" data-ans="${s}" ${out || !canAct(s) ? 'disabled' : ''}>Beküldöm</button>
      <button class="btn ghost" data-act='{"t":"help"}' data-side="${s}" ${d.hp.includes(s) || out || !canAct(s) ? 'disabled' : ''}>Segítséget kérek</button></div></div></div>`;
  }).join('');
  return `<div class="stack"><div class="frame cut"><div class="fi"><div class="row" style="justify-content:space-between"><span class="lbl">Idő · 2 perc</span><span class="disp" id="tleft" style="font-size:20px">--</span></div><div class="timer" style="margin-top:6px"><i id="tbar" style="width:100%"></i></div></div></div>
    ${kcardHTML(c)}${refHTML()}<div class="duelgrid">${panels}</div>
    <p class="hint">Mindkét Kriptográfus egyszer kérhet segítséget a csapatától. Hibás válasz után az a Kriptográfus kiesik. Ha senki sem fejti meg időben, a támadás sikertelen, de a Blue nem kap Észlelés jelzőt.</p></div>`;
}

const LOGTXT = {
  start: () => 'A játék elkezdődött. A Red kezd.',
  rd: n => `${n}. KÖR`,
  shuf: s => `A ${SIDE[s]} pakli elfogyott, a dobópaklit megkevertétek.`,
  peek: () => 'Red Felderítő belenézett a Blue kezébe.',
  ov: () => 'Red Operációvezető: ebben a körben két támadás jön.',
  ov2: z => `Második támadás: ${ZN[z][0]}.`,
  rp: k => `A Red újratervezett, ${k} lapot cserélt.`,
  noatk: () => 'A Red ebben a körben nem tudott támadni.',
  atk: z => `A Red lefordítva támad: ${ZN[z][0]}.`,
  clash: (r, b, rt, bt) => `Felfedés: ${cardOf(r).hu} (${rt}) vs ${b === '-' ? 'passz' : cardOf(b).hu + ' (' + bt + ')'}.`,
  rw: z => `Sikeres támadás, a bábu ide lép: ${ZN[z][0]}.`,
  bw: (d, soc) => `Sikeres védekezés: ${d}. Észlelés jelző${soc ? ' (SOC elemző: +1)' : ''}.`,
  duel: lv => `Döntetlen: ${ROMAN[lv]}. szintű kriptopárbaj.`,
  dwin: s => `A ${SIDE[s]} Kriptográfusa fejtette meg előbb.`,
  dwrong: s => `A ${SIDE[s]} Kriptográfusa hibás választ adott, kiesett.`,
  dto: () => 'Senki sem fejtette meg: a támadás sikertelen, nincs Észlelés jelző.',
  ctrl: c => `Tartós kontroll: ${cardOf(c).hu} (+1, ${ZN[cardOf(c).c][0]}).`,
  ir: z => `Incidenskezelő: a bábu visszalép ide: ${ZN[z][0]}.`,
  end: (w, why) => w ? `${SIDE[w]} győzelem.` : `A játékot megszakították (${SIDE[why.split(':')[1]] || ''}).`
};
function logHTML() {
  return `<div class="panel cut"><div class="lbl" style="margin-bottom:6px">Napló</div><ul class="log">${ST.lg.slice().reverse().map(e => `<li class="${e[0] === 'rd' ? 'rd' : ''}">${esc((LOGTXT[e[0]] || (() => ''))(...e.slice(1)))}</li>`).join('')}</ul></div>`;
}
function rolesHTML() {
  const s = ['r', 'b'].map(side => {
    const rs = ROLE_KEYS[side].map((k, i) => ({ k, i, on: ST.cfg[side].ro[i] })).filter(x => x.on);
    return `<div><div class="lbl ${side}" style="margin-bottom:4px">${SIDE[side]} szerepkörök</div>${rs.map(x => {
      const r = roleOf(side, x.i);
      const used = { lead: ST.u.lead, recon: ST.u.recon >= 2, ciso: ST.u.ciso, ir: ST.u.ir }[x.k];
      return `<div style="font-size:13px;margin-bottom:4px;${used ? 'opacity:.5' : ''}"><b>${esc(r.hu)}</b>${used ? ' <span class="tag">FELHASZNÁLVA</span>' : ''}<br><span style="color:var(--soft)">${esc(r.ab)}</span></div>`;
    }).join('')}</div>`;
  }).join('');
  return `<details class="panel cut"><summary class="lbl" style="cursor:pointer">Szerepkörök és képességek</summary><div class="reftbl" style="margin-top:8px">${s}</div></details>`;
}

function setupHTML() {
  const panel = side => {
    const c = ST.cfg[side], mine = MODE === 'local' || MY === side;
    const err = cfgError(ST, side, c);
    const roles = ROLE_KEYS[side].map((k, i) => {
      const r = roleOf(side, i);
      return `<label class="rolechk"><input type="checkbox" data-role="${side}" data-i="${i}" ${c.ro[i] ? 'checked' : ''} ${!mine || c.n >= 3 || c.ok ? 'disabled' : ''}><span><b>${esc(r.hu)}</b> <span class="tag tg">${esc(r.tm || { always: 'MINDIG', duel: 'PÁRBAJKOR' }[r.u] || '')}</span><small>${esc(r.ab)}</small></span></label>`;
    }).join('');
    return `<div class="frame cut"><div class="fi"><h2 class="${side}">${SIDE[side]}</h2><p class="hint" style="margin:4px 0 10px">${side === 'r' ? 'Támadók: végig akarnak jutni az öt szakaszon.' : 'Védők: 5 Észlelés jelzőt gyűjtenek, vagy kitartanak a 10. kör végéig.'}</p>
      <div class="lbl" style="margin-bottom:6px">Létszám</div><div class="seg">${[2, 3, 4, 5].map(n => `<button data-n="${n}" data-side="${side}" aria-pressed="${c.n === n}" ${!mine || c.ok ? 'disabled' : ''}>${n}</button>`).join('')}</div>
      <p class="hint">${c.n === 2 ? 'Két fő esetén pontosan 3 szerepkört választotok.' : 'Mind az 5 szerepkör játékban van; ha kevesebben vagytok ötnél, valaki több szerepet visz.'}</p>
      <div>${roles}</div>${err && mine ? `<p class="hint r" style="font-weight:700">${esc(err)}</p>` : ''}
      <div class="row" style="margin-top:12px">${c.ok ? '<span class="tag tb">KÉSZ</span>' : mine ? `<button class="btn ${side === 'r' ? 'red' : 'blue'}" data-act='{"t":"ready"}' data-side="${side}" ${err ? 'disabled' : ''}>Kész vagyunk</button>` : '<span class="lbl">Az ellenfél még beállít…</span>'}</div></div></div>`;
  };
  const opp = MODE === 'host' ? (PEERS.some(p => !p.sameTab && p.presence && p.presence.gid === SEAT) ? '<span class="tag tb">ELLENFÉL CSATLAKOZOTT</span>' : '<span class="tag tr">VÁRAKOZÁS AZ ELLENFÉLRE</span>') : '';
  return `${MODE === 'host' ? `<div class="panel cut" style="margin-top:14px"><div class="row" style="justify-content:space-between"><div><div class="lbl">Játékkód · küldd el az ellenfélnek</div><div class="code" style="color:var(--ink);margin-top:6px">${CODE.toUpperCase()}</div></div>${opp}</div><p style="margin:10px 0 0;font-size:14px">Az ellenfél ugyanezt az oldalt nyitja meg, a „Csatlakozás kóddal” gombra kattint, és beírja a kódot. Te a ${SIDE[MY]} csapat vagy.</p></div>` : ''}
   <div class="setup">${panel('r')}${panel('b')}</div>
   <label class="rolechk" style="margin-top:12px"><input type="checkbox" data-alt="1" ${ST.cfg.alt ? 'checked' : ''} ${MODE === 'guest' ? 'disabled' : ''}><span><b>Alternatív mód: kiegyensúlyozott kis csapatok</b><small>A 2 fős Blue csapat nem választhatja egyszerre a SOC elemzőt és az Incidenskezelőt.</small></span></label>`;
}

function endHTML() {
  if (!ST.w) {
    const hist = ST.hist.split('').filter(Boolean);
    return `<div class="end cut"><div class="lbl">Megszakítva · ${ST.rd}. kör</div><div class="disp" style="color:var(--btn-on-bg)">ABORT</div><p>A játékot a ${SIDE[ST.wr.split(':')[1]] || ''} csapat megszakította. Nincs győztes.</p>
   <div class="row" style="justify-content:center"><button class="btn" data-a="again">Új játék</button><button class="btn ghost" data-a="menu">Vissza a menübe</button></div></div>${hist.length ? `<div class="frame cut"><div class="fi"><h2>Eddig kijátszott lapok</h2><div class="detail" style="margin-top:8px">${hist.map(caseHTML).join('')}</div></div></div>` : ''}`;
  }
  const why = { r5: 'A Red sikeresen támadott a CÉL szakaszon.', b5: 'A Blue összegyűjtötte az 5. Észlelés jelzőt.', b10: 'A Blue kitartott a 10. kör végéig.' }[ST.wr];
  const hist = ST.hist.split('').filter(Boolean);

   <div class="row" style="justify-content:center"><button class="btn ${ST.w === 'r' ? 'red' : 'blue'}" data-a="again">Új játék</button></div></div>
   <div class="frame cut"><div class="fi"><h2>Kiértékelés</h2><p class="hint">Menjetek végig a kijátszott lapok valós esetein. Mindkét csapat nevezze meg azt a lépést, amely szerintük eldöntötte a játékot, és hogy a valós esetben mi akadhatott volna meg.</p>
   <div class="detail">${hist.map(caseHTML).join('')}</div></div></div>`;
}

   <div class="choices">
    <button class="choice cut" data-a="local"><div class="fi cut"><span class="lbl">Egy eszközön</span><b>Helyi játék</b><span class="hint">Egy képernyő, két csapat. A kezeket a soron lévő csapat fedi fel.</span></div></button>
    ${loc && loc.ph !== 'end' ? `<button class="choice cut" data-a="resume"><div class="fi cut"><span class="lbl">Mentett helyi játék</span><b>Folytatás · ${loc.rd ? loc.rd + '. kör' : 'beállítás'}</b></div></button>` : ''}
    <div class="choice cut" style="cursor:default"><div class="fi cut"><span class="lbl">Két eszközön</span><b>Online játék indítása</b><span class="hint">Kapsz egy kódot, az ellenfél azzal csatlakozik.</span>
      <div class="row" style="margin-top:8px"><button class="btn red hostred" data-a="host" data-side="r" ${online ? '' : 'disabled'}>Red leszek</button><button class="btn blue" data-a="host" data-side="b" ${online ? '' : 'disabled'}>Blue leszek</button>${host && host.st && host.st.ph !== 'end' && online ? `<button class="btn ghost" data-a="rehost">Folytatás · ${esc(host.code.toUpperCase())}</button>` : ''}</div></div></div>
    <div class="choice cut" style="cursor:default"><div class="fi cut"><span class="lbl">Két eszközön</span><b>Csatlakozás kóddal</b>
      <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" id="joincode" maxlength="5" placeholder="KÓD" aria-label="Játékkód" ${online ? '' : 'disabled'}><button class="btn" data-a="join" ${online ? '' : 'disabled'}>Belépés</button></div></div></div>
    ${online ? '' : '<p class="hint">Az online mód csak bejelentkezett megtekintőknek érhető el a Claude felületén. A helyi játék mindenhol működik.</p>'}
   </div></div>
   <div class="frame cut" style="margin-top:20px"><div class="fi"><h2>Egy kör röviden</h2>
   <ol style="margin:8px 0 0;padding-left:20px;columns:2 260px;column-gap:28px">
    <li><b>Húzás:</b> mindkét csapat 5 lapra egészít ki.</li><li><b>Támadás:</b> a Red lefordítva kijátszik egy lapot a bábu szakaszának kategóriájából.</li>
    <li><b>Védekezés:</b> a Blue azonos kategóriájú lappal védekezik, vagy passzol.</li><li><b>Felfedés és eredmény:</b> erősség + szerepkör-bónusz + tartós kontrollok. A nagyobb nyer, döntetlennél kriptopárbaj.</li>
    <li><b>Megerősítés:</b> a Blue lerakhat egy „Tartós” lapot kontrollként.</li><li><b>Takarítás:</b> a körjelző lép. A 10. kör végén a Blue nyer.</li></ol></div></div>`;
}

function gameHTML() {
  if (!ST) return `<div class="panel cut" style="margin-top:16px"><div class="lbl">Csatlakozás</div><h2 style="color:var(--white);margin-top:6px">Várakozás a házigazdára · ${esc(CODE.toUpperCase())}</h2><p>Ha sokáig nem történik semmi, ellenőrizd a kódot.</p></div>`;
  if (ST.ph === 'setup') return `${phaseHTML()}${setupHTML()}`;
  const mid = ST.ph === 'end' ? endHTML() : ST.ph === 'duel' ? duelHTML() : clashHTML();
  const hands = ['r', 'b'].map(handPanel).join('');
  const spect = MODE === 'guest' && !MY ? '<p class="hint">Nézőként követed a játékot.</p>' : '';
  return `<div class="game"><div class="stack">${boardHTML()}${rolesHTML()}${logHTML()}</div>
    <div class="stack" style="min-width:0">${phaseHTML()}${spect}${mid}${ST.ph !== 'end' ? hands : ''}</div></div>`;
}

function render() {
  const a = document.activeElement, fid = a && a.id, pos = a && a.selectionStart;
  const mode = { local: 'HELYI JÁTÉK', host: 'ONLINE · ' + (MY ? SIDE[MY].toUpperCase() : ''), guest: 'ONLINE · ' + (MY ? SIDE[MY].toUpperCase() : 'NÉZŐ') }[MODE] || '';
  document.getElementById('app').innerHTML = `<div class="accent"><i></i><i></i></div>
   <header class="top"><span class="logo"><span class="r">RED</span><small>VS</small><span class="b">BLUE</span></span>${mode ? `<span class="pill">${mode}</span>` : ''}${MODE !== 'local' && CODE && SCREEN === 'game' ? `<span class="pill">KÓD ${esc(CODE.toUpperCase())}</span>` : ''}<span class="sp"></span>
    ${SCREEN === 'game' && ST && ST.ph !== 'end' && (MODE === 'local' || MY) ? '<button class="btn abort" data-a="abortask" aria-expanded="' + ABORTASK + '">Abort</button>' : ''}${SCREEN === 'game' ? '<button class="btn" data-a="menu">Kilépés a menübe</button>' : ''}</header>
   ${ABORTASK && SCREEN === 'game' && ST && ST.ph !== 'end' ? '<div class="abortbar" role="alertdialog" aria-label="Játék megszakítása"><b>Biztosan megszakítod a játékot? Nem lesz győztes, és a játszma nem folytatható.</b><div class="row"><button class="btn abort" data-a="abortyes">Igen, megszakítom</button><button class="btn" data-a="abortno">Mégse</button></div></div>' : ''}
   <main class="wrap">${SCREEN === 'menu' ? menuHTML() : gameHTML()}</main>${TOAST ? `<div class="toast" role="status">${esc(TOAST)}</div>` : ''}`;
  if (fid) { const el = document.getElementById(fid); if (el && !el.disabled) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) { } } }
  tick();
}

function tick() {
  if (!ST || ST.ph !== 'duel' || !ST.du) return;
  const now = Date.now() + (MODE === 'guest' ? HOSTOFF : 0);
  const left = Math.max(0, ST.du.t0 + DUEL_MS - now);
  const t = document.getElementById('tleft'), b = document.getElementById('tbar');
  if (t) t.textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}`;
  if (b) b.style.width = (left / DUEL_MS * 100) + '%';
  if (left <= 0 && MODE !== 'guest') { const r = act(ST, 'r', { t: 'timeout' }); if (!r.err) { ST = r.st; afterChange(); persist(); publishHost(); render(); } }
}
setInterval(tick, 500);

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-a]'); if (!t || t.disabled) return;
  const side = t.dataset.side;
  if (t.dataset.card) {
    const ch = t.dataset.card, s = cardOf(ch).s;
    if (!viewSides().includes(s)) return;
    const multi = ST.ph === 'atk' && s === 'r' && !hasCat(ST, 'r', ST.z) && !ST.rp;
    const cur = SEL[s];
    if (multi) SEL[s] = cur.includes(ch) ? cur.filter(x => x !== ch) : (cur.length < 3 ? [...cur, ch] : cur);
    else SEL[s] = cur[0] === ch ? [] : [ch];
    return render();
  }
  if (t.dataset.n) { dispatch(side, { t: 'cfg', n: +t.dataset.n, ro: ST.cfg[side].ro }); return; }
  if (t.dataset.act) { dispatch(side, JSON.parse(t.dataset.act)); return; }
  if (t.dataset.ans) { const s = t.dataset.ans; dispatch(s, { t: 'ans', a: DATA.crypto[dec(ST.du.c)].f.map((f, i) => DRAFT[s][i] || '') }); return; }
  switch (t.dataset.a) {
    case 'local': MODE = 'local'; ST = newGame((Math.random() * 4294967296) >>> 0); lastPh = 'setup'; SCREEN = 'game'; persist(); return render();
    case 'resume': MODE = 'local'; ST = store.get('rvb-local'); lastPh = ST.ph; SCREEN = 'game'; return render();
    case 'host': return hostGame(side);
    case 'rehost': return hostGame(null, store.get('rvb-host'));
    case 'join': return joinGame(document.getElementById('joincode').value);
    case 'show': SHOW[side] = true; return render();
    case 'hide': SHOW[side] = false; SEL[side] = []; return render();
    case 'menu': ABORTASK = false; return leave();
    case 'abortask': ABORTASK = !ABORTASK; return render();
    case 'abortno': ABORTASK = false; return render();
    case 'abortyes': ABORTASK = false; dispatch(MODE === 'local' ? (activeSide() || 'r') : MY, { t: 'abort' }); return;
    case 'again':
      if (MODE === 'local') { ST = newGame((Math.random() * 4294967296) >>> 0); lastPh = 'setup'; persist(); return render(); }
      if (MODE === 'host') { ST = newGame((Math.random() * 4294967296) >>> 0); lastPh = 'setup'; persist(); publishHost(); return render(); }
      return toast('Új játékot a házigazda indíthat.');
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.role) { const s = t.dataset.role, ro = ST.cfg[s].ro.slice(); ro[+t.dataset.i] = t.checked ? 1 : 0; dispatch(s, { t: 'cfg', n: ST.cfg[s].n, ro }); }
  if (t.dataset.alt) dispatch(MODE === 'local' ? 'r' : MY, { t: 'alt', v: t.checked });
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.draft) DRAFT[t.dataset.draft][+t.dataset.i] = t.value; });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'joincode') joinGame(t.value);
  else if (t.dataset && t.dataset.draft) { const b = document.querySelector(`[data-ans="${t.dataset.draft}"]`); if (b && !b.disabled) b.click(); }
});

render();
getRoom();

</script>

</body></html>
